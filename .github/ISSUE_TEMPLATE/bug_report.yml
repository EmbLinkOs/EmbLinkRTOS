name: Bug report
description: Report reproducible behavior that differs from a current contract.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Check the [implementation inventory](https://github.com/EmbLinkOs/EmbLinkRTOS/blob/main/docs/STATUS.md) before reporting a planned feature as broken.
        For a vulnerability, use the private route in [SECURITY.md](https://github.com/EmbLinkOs/EmbLinkRTOS/blob/main/SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Kernel / synchronization / time
        - Native port
        - Cortex-M port
        - RISC-V port
        - AVR port
        - Configuration / build / CI
        - Reference model / bridge
        - Documentation
        - Unsure
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Source revision
      description: Full commit SHA or release tag, plus any local changes.
      placeholder: Output of git rev-parse HEAD
    validations:
      required: true
  - type: input
    id: configuration
    attributes:
      label: Target and configuration
      description: Preset, board/SoC or host OS, profile, and extra configuration fragments/overrides.
      placeholder: native-gcc, Linux x86-64, base/checked, no overrides
    validations:
      required: true
  - type: input
    id: toolchain
    attributes:
      label: Toolchain
      description: Compiler version and, where relevant, Python/CMake/QEMU versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal code and exact configure/build/run commands. For a differential failure, include the encoded input and exact schedule, not just a seed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Cite the API, requirement or specification when possible.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the failure, exit status, and any relevant case-level results/skips.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and artifacts
      description: Attach relevant logs and configuration; remove credentials and private data.


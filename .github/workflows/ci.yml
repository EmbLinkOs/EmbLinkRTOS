# Copyright 2026 Junior Deogracias
# Build matrix of 05 §2.2 and §5: native GCC and Clang (checked, release, tiny, sanitizers),
# Cortex-M with arm-none-eabi-gcc and RISC-V with riscv64-unknown-elf-gcc run under QEMU,
# AVR with avr-gcc run under QEMU and on EmbSIM's Arduino Uno, the Cortex-M4F suite on EmbSIM's
# NUCLEO-F446RE (SIM-002), formatting, and the footprint gate (TEST-011).
# Target order: Cortex-M and RISC-V first, AVR secondary (ADR-038).
# The experimental EmbCC-kernel / GCC-host native legs use a pinned EmbCC release (09 §11).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group: # the merge queue tests a pull request on the latest main before merging it

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # a hung step fails the job in minutes, not GitHub's six hours
    strategy:
      fail-fast: false
      matrix:
        preset: [native-gcc, native-clang, native-release, native-tiny, native-periodic, native-timeslice, native-timeslice-tickless, native-asan, native-tsan, native-coverage]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        timeout-minutes: 15 # apt has hung for six hours here (#32, #34, #35, #44)
        uses: ./.github/actions/apt-install # archives cached, then scripts/ci-apt-install.sh
        with:
          packages: ninja-build clang python3-yaml
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error
      - name: Collect case evidence
        # right after the suite: a later ctest run (one test, below) rewrites LastTest.log
        if: always()
        run: python3 -I tools/evidence/collect.py --build build/${{ matrix.preset }} --preset ${{ matrix.preset }} --out case-evidence-${{ matrix.preset }}.json
      - name: Decode the crash records test_crash printed (tools/crashdec, OBS-016)
        if: matrix.preset == 'native-gcc'
        run: |
          ctest --preset native-gcc -R '^test_crash$' --verbose > crash.log
          python3 -I tools/crashdec/crashdec.py crash.log --elf build/native-gcc/tests/conformance/test_crash
      - name: Coverage report
        if: matrix.preset == 'native-coverage'
        run: |
          # 05 §5: kernel coverage does not regress (the floors of tools/coverage/thresholds.json)
          status=0
          python3 -I tools/coverage/report.py --json coverage.json --markdown coverage.md \
                  --thresholds tools/coverage/thresholds.json || status=$?
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Upload coverage
        if: matrix.preset == 'native-coverage'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.*
      - name: FreeRTOS's side of bench_compare for Cortex-M4 (tools/bench/freertos-cm4), both boards
        if: matrix.preset == 'cm4-an386'
        run: |
          tools/bench/freertos-cm4/build.sh nucleo_f446re
          tools/bench/freertos-cm4/build.sh mps2_an386
          # a functional check, not a timing (SIM-003): every measurement reported, every wake taken
          python3 -I tools/qemu/run_qemu.py --qemu qemu-system-arm --until BENCH_END --timeout 120 \
            --qemu-args "-M mps2-an386 -icount shift=5,sleep=off -kernel" \
            build/freertos-cm4-mps2_an386/bench_compare.elf | tee freertos-cm4.log
          test "$(grep -c '^BENCH v1' freertos-cm4.log)" -eq 4
          ! grep -q 'isr_wake woke' freertos-cm4.log
      - name: FreeRTOS's side of bench_compare for the Pico 2 W (tools/bench/freertos-cm33), build only
        if: matrix.preset == 'cm33-an505'
        run: |
          tools/bench/freertos-cm33/build.sh
          test -s build/freertos-cm33-pico2_w/bench_compare.uf2
      - name: Upload case evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: case-evidence-${{ matrix.preset }}
          path: case-evidence-${{ matrix.preset }}.json
          if-no-files-found: warn
      - name: Numeric fault IDs without location strings
        if: matrix.preset == 'native-gcc'
        run: |
          cmake -S . -B build/native-fault-no-where -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/native-gcc.cmake -DEMB_BOARD=native \
            -DEMB_SET="EMB_FAULT_WHERE=n"
          cmake --build build/native-fault-no-where --target test_fault
          ctest --test-dir build/native-fault-no-where -R '^test_fault$' --no-tests=error --verbose
      - name: Preserve differential failure bundles
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differential-failures-${{ matrix.preset }}
          path: build/differential-failures/
          if-no-files-found: ignore

  cortex_m:
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # a hung step fails the job in minutes, not GitHub's six hours
    strategy:
      fail-fast: false
      matrix:
        preset: [cm0-microbit, cm0-microbit-release, cm3-an385, cm4-an386, cm4-an386-release, cm4-an386-tiny, cm7-an500, cm7-an500-release, cm33-an505, cm33-an505-release, cm33-an505-tiny]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        timeout-minutes: 15 # apt has hung for six hours here (#32, #34, #35, #44)
        uses: ./.github/actions/apt-install # archives cached, then scripts/ci-apt-install.sh
        with:
          packages: ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm python3-yaml gdb-multiarch
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test under QEMU
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error --verbose
      - name: Collect case evidence
        # right after the suite: a later ctest run (one test, below) rewrites LastTest.log
        if: always()
        run: python3 -I tools/evidence/collect.py --build build/${{ matrix.preset }} --preset ${{ matrix.preset }} --out case-evidence-${{ matrix.preset }}.json
      - name: Build the Raspberry Pi Pico 2 W (RP2350, A79; no emulator models it, so build only)
        if: matrix.preset == 'cm33-an505'
        run: |
          cmake --preset cm33-pico2w
          cmake --build --preset cm33-pico2w
          # every image is a UF2 the boot ROM accepts: uf2.py refuses one without an IMAGE_DEF
          test "$(ls build/cm33-pico2w/tests/conformance/*.uf2 | wc -l)" -ge 19
      - name: Decode and symbolize the record that survived the reset (tools/crashdec, OBS-016)
        if: matrix.preset == 'cm4-an386'
        run: |
          ctest --preset cm4-an386 -R '^test_crash_reset$' --verbose > crash-reset.log
          python3 -I tools/crashdec/crashdec.py crash-reset.log --tool-prefix arm-none-eabi- \
            --elf build/cm4-an386/tests/conformance/test_crash_reset.elf | tee crashdec.txt
          grep -q "in crash_record_survives_reset at" crashdec.txt
          # a hardware fault's registers (A74): the udf's UsageFault status, symbolized
          ctest --preset cm4-an386 -R '^test_crash_hw$' --verbose > crash-hw.log
          python3 -I tools/crashdec/crashdec.py crash-hw.log --tool-prefix arm-none-eabi- \
            --elf build/cm4-an386/tests/conformance/test_crash_hw.elf | tee crashdec-hw.txt
          grep -q "UNDEFINSTR" crashdec-hw.txt
          grep -q "in crash_record_keeps_a_hardware_fault at" crashdec-hw.txt
      - name: Upload case evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: case-evidence-${{ matrix.preset }}
          path: case-evidence-${{ matrix.preset }}.json
          if-no-files-found: warn
      - name: Single-level non-nesting IRQ conformance
        if: matrix.preset == 'cm3-an385'
        run: |
          cmake -S . -B build/cm3-irq-single -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/arm-none-eabi-gcc.cmake -DEMB_BOARD=mps2_an385 \
            -DEMB_SET="EMB_CM_KERNEL_BASEPRI=192;EMB_CM_IRQ_PRIORITY=192;EMB_IRQ_NESTING=n"
          cmake --build build/cm3-irq-single --target test_irq_priority
          ctest --test-dir build/cm3-irq-single -R '^test_irq_priority$' --no-tests=error --verbose
      - name: Footprint report
        run: |
          python3 -I tools/footprint/footprint.py \
            build/${{ matrix.preset }}/samples/first_execution/first_execution.elf.map \
            --elf build/${{ matrix.preset }}/samples/first_execution/first_execution.elf --nm arm-none-eabi-nm \
            --storage-h build/${{ matrix.preset }}/generated/include/emb/storage.h \
            --title "${{ matrix.preset }}" --json footprint-${{ matrix.preset }}.json | tee footprint-${{ matrix.preset }}.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: footprint-${{ matrix.preset }}
          path: footprint-${{ matrix.preset }}.*

  riscv:
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # a hung step fails the job in minutes, not GitHub's six hours
    strategy:
      fail-fast: false
      matrix:
        preset: [rv32-virt, rv32-virt-release, rv32-virt-tiny]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        timeout-minutes: 15 # apt has hung for six hours here (#32, #34, #35, #44)
        uses: ./.github/actions/apt-install # archives cached, then scripts/ci-apt-install.sh
        with:
          packages: ninja-build gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf qemu-system-misc python3-yaml gdb-multiarch
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test under QEMU
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error
      - name: Collect case evidence
        # right after the suite: a later ctest run (one test, below) rewrites LastTest.log
        if: always()
        run: python3 -I tools/evidence/collect.py --build build/${{ matrix.preset }} --preset ${{ matrix.preset }} --out case-evidence-${{ matrix.preset }}.json
      - name: Decode a hardware fault's registers (tools/crashdec, A74)
        if: matrix.preset == 'rv32-virt'
        run: |
          ctest --preset rv32-virt -R '^test_crash_hw$' --verbose > crash-hw.log
          python3 -I tools/crashdec/crashdec.py crash-hw.log --tool-prefix riscv64-unknown-elf- \
            --elf build/rv32-virt/tests/conformance/test_crash_hw.elf | tee crashdec-hw.txt
          grep -q "mcause     0x00000003  breakpoint" crashdec-hw.txt
          grep -q "in crash_record_keeps_a_hardware_fault at" crashdec-hw.txt
      - name: Upload case evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: case-evidence-${{ matrix.preset }}
          path: case-evidence-${{ matrix.preset }}.json
          if-no-files-found: warn
      - name: Footprint report
        run: |
          python3 -I tools/footprint/footprint.py \
            build/${{ matrix.preset }}/samples/first_execution/first_execution.elf.map \
            --elf build/${{ matrix.preset }}/samples/first_execution/first_execution.elf --nm riscv64-unknown-elf-nm \
            --storage-h build/${{ matrix.preset }}/generated/include/emb/storage.h \
            --title "${{ matrix.preset }}" --json footprint-${{ matrix.preset }}.json | tee footprint-${{ matrix.preset }}.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: footprint-${{ matrix.preset }}
          path: footprint-${{ matrix.preset }}.*

  # The Cortex-M and RISC-V ports built by Clang and linked by LLD (ADR-053), against the GNU
  # toolchains' C libraries and libgcc (cmake/toolchains/{arm-none-eabi,riscv}-clang.cmake), and
  # the AVR port built by Clang and linked by avr-gcc (avr-clang.cmake), then run under QEMU: the
  # same suites as the GCC jobs. Ubuntu's Clang is an older release than the
  # one used locally, so the two together cover a range.
  clang-cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # a hung step fails the job in minutes, not GitHub's six hours
    strategy:
      fail-fast: false
      matrix:
        preset: [cm0-microbit-clang, cm3-an385-clang, cm4-an386-clang, cm4-an386-release-clang, cm7-an500-clang, cm33-an505-clang, rv32-virt-clang, rv32-virt-release-clang, avr-uno-clang, avr-uno-t1-clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        timeout-minutes: 15 # apt has hung for six hours here (#32, #34, #35, #44)
        uses: ./.github/actions/apt-install # archives cached, then scripts/ci-apt-install.sh
        with:
          packages: ninja-build clang lld gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf qemu-system-misc gcc-avr avr-libc binutils-avr python3-yaml gdb-multiarch
      - name: Configure
        run: |
          clang --version | head -1
          ld.lld --version
          cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test under QEMU
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error
      - name: Collect case evidence
        if: always()
        run: python3 -I tools/evidence/collect.py --build build/${{ matrix.preset }} --preset ${{ matrix.preset }} --out case-evidence-${{ matrix.preset }}.json
      - name: Upload case evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: case-evidence-${{ matrix.preset }}
          path: case-evidence-${{ matrix.preset }}.json
          if-no-files-found: warn

  # EMB_LTO (ADR-056): the same suites with link-time optimization, which drops whatever only
  # assembly or a linker script references unless it is EMB_USED, and folds statics across
  # kernel calls unless -fno-ipa-reference keeps them barriers. Ubuntu's toolchains.
  lto:
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # a hung step fails the job in minutes, not GitHub's six hours
    strategy:
      fail-fast: false
      matrix:
        preset: [native-gcc, cm4-an386, cm4-an386-clang, cm33-an505, rv32-virt, avr-uno]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        timeout-minutes: 15 # apt has hung for six hours here (#32, #34, #35, #44)
        uses: ./.github/actions/apt-install # archives cached, then scripts/ci-apt-install.sh
        with:
          packages: ninja-build clang lld llvm gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf qemu-system-misc gcc-avr avr-libc binutils-avr python3-yaml
      - name: Configure with EMB_LTO
        run: cmake --preset ${{ matrix.preset }} -B build/lto -DEMB_LTO=ON
      - name: Build
        run: cmake --build build/lto
      - name: Test
        run: ctest --test-dir build/lto --output-on-failure --no-tests=error

  avr:
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # a hung step fails the job in minutes, not GitHub's six hours
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: avr-uno
            sample: first_execution
          - preset: avr-uno-release
            sample: first_execution
          - preset: avr-uno-t1
            sample: footprint_t1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        timeout-minutes: 15 # apt has hung for six hours here (#32, #34, #35, #44)
        uses: ./.github/actions/apt-install # archives cached, then scripts/ci-apt-install.sh
        with:
          packages: ninja-build gcc-avr avr-libc binutils-avr qemu-system-misc python3-yaml
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: FreeRTOS's build of the comparison benchmark (A94)
        if: matrix.preset == 'avr-uno'
        run: tools/bench/freertos-avr/build.sh build/freertos-avr
      - name: Test under QEMU
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error
      - name: Collect case evidence
        if: always()
        run: python3 -I tools/evidence/collect.py --build build/${{ matrix.preset }} --preset ${{ matrix.preset }} --out case-evidence-${{ matrix.preset }}.json
      - name: Upload case evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: case-evidence-${{ matrix.preset }}
          path: case-evidence-${{ matrix.preset }}.json
          if-no-files-found: warn
      - name: Footprint
        run: |
          python3 -I tools/footprint/footprint.py \
            build/${{ matrix.preset }}/samples/${{ matrix.sample }}/${{ matrix.sample }}.elf.map \
            --elf build/${{ matrix.preset }}/samples/${{ matrix.sample }}/${{ matrix.sample }}.elf --nm avr-nm \
            --storage-h build/${{ matrix.preset }}/generated/include/emb/storage.h \
            --title "${{ matrix.preset }}" --json footprint-${{ matrix.preset }}.json \
            --thresholds tools/footprint/thresholds-${{ matrix.preset }}.json | tee footprint-${{ matrix.preset }}.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: footprint-${{ matrix.preset }}
          path: footprint-${{ matrix.preset }}.*

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # a hung step fails the job in minutes, not GitHub's six hours
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        timeout-minutes: 15 # apt has hung for six hours here (#32, #34, #35, #44)
        uses: ./.github/actions/apt-install # archives cached, then scripts/ci-apt-install.sh
        with:
          packages: clang-format-18 python3-yaml
      - name: clang-format
        run: |
          find include kernel arch boards soc drivers samples tests \( -name '*.c' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format-18 --dry-run -Werror
      - name: Banned constructs
        run: python3 -I scripts/check-banned.py
      - name: Changelog entries (changes/)
        run: |
          python3 -I -m unittest discover -s tools/release -p 'test_*.py' -v
          python3 -I tools/release/changes.py check
      - name: API ID registry and decoder contract
        run: |
          python3 -I tools/fault/generate.py --check
          python3 -I -m unittest discover -s tools/fault -p 'test_*.py' -v
      - name: Storage marker contract
        run: python3 -I -m unittest discover -s tools/storage -p 'test_*.py' -v
      - name: Mixed native compiler launcher contract
        run: python3 -I -m unittest discover -s tools/toolchain -p 'test_*.py' -v
      - name: Double build contract
        run: python3 -I -m unittest discover -s tools/repro -p 'test_*.py' -v
      - name: Static analysis runner contract
        run: python3 -I -m unittest discover -s tools/analysis -p 'test_*.py' -v
      - name: SBOM contract
        run: python3 -I -m unittest discover -s tools/sbom -p 'test_*.py' -v
      - name: ESP32-C3 image format
        run: python3 -I -m unittest discover -s tools/esp -p 'test_*.py' -v
      - name: Debug descriptor reader (OBS-008, A107)
        run: python3 -I -m unittest discover -s tools/descriptor -p 'test_*.py' -v
      - name: UF2 writer (A79)
        run: python3 -I -m unittest discover -s tools/uf2 -p 'test_*.py' -v
      - name: Board support matrix (ADR-051, A81)
        run: |
          python3 -I -m unittest discover -s tools/support -p 'test_*.py' -v
          python3 -I tools/support/matrix.py --check
      - name: Footprint report tool
        run: python3 -I -m unittest discover -s tools/footprint -p 'test_*.py' -v
      - name: Case evidence tools
        run: python3 -I -m unittest discover -s tools/evidence -p 'test_*.py' -v
      - name: Coverage report tool tests
        run: python3 -I -m unittest discover -s tools/coverage -p 'test_*.py' -v
      - name: Resource-bound inventory covers every non-constant cost
        run: python3 -I tools/evidence/check_bounds.py
      - name: The interrupt-safe function table is current
        run: python3 -I tools/docs/isr_table.py --check
      - name: Configuration tool self-check
        run: |
          python3 -I tools/kconfig/embconfig.py --kconfig Kconfig --manifest arch/native/arch.yaml \
            --conf boards/native/native/board.conf --conf configs/base.conf --print > /dev/null
          python3 -I tools/kconfig/embconfig.py --kconfig Kconfig --manifest arch/avr/arch.yaml \
            --conf boards/arduino/arduino_uno/generated/board.conf --conf configs/tiny.conf --print > /dev/null
      - name: IRQ configuration and encoding regressions
        run: python3 -I -m unittest discover -s tools/kconfig -p 'test_*.py' -v
      - name: Crash record decoder
        run: python3 -I -m unittest discover -s tools/crashdec -p 'test_*.py' -v
      - name: Hardware-in-the-loop runner (a pseudo-terminal for the board)
        run: python3 -I -m unittest discover -s tools/hil -p 'test_*.py' -v
      - name: Hardware generator (schemas, rules, committed outputs)
        run: |
          pip install jsonschema
          python3 -I -m unittest discover -s hw/gen -p 'test_*.py' -v
          python3 -I -m unittest discover -s hw/import -p 'test_*.py' -v
          python3 -I hw/gen/emb-hwgen.py check
      - name: Reference model
        run: |
          pip install hypothesis pytest
          cd tools/model && python3 -m pytest -q

  avr-embsim:
    # the conformance suite on EmbSIM's Arduino Uno (SIM-002): EmbSIM built from source,
    # each test image run in virtual time until its EMB_TEST_END (tools/embsim/run_embsim.py)
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # a hung step fails the job in minutes, not GitHub's six hours
    env:
      EMBSIM_REF: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EmbLinkOs/EmbSIM
          ref: ${{ env.EMBSIM_REF }}
          path: embsim
      - name: Install tools
        timeout-minutes: 15 # apt has hung for six hours here (#32, #34, #35, #44)
        uses: ./.github/actions/apt-install # archives cached, then scripts/ci-apt-install.sh
        with:
          packages: ninja-build gcc-avr avr-libc binutils-avr python3-yaml
      - name: Build EmbSIM
        run: |
          cmake -S embsim -B embsim/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEMBSIM_SERVER=OFF -DEMBSIM_BUILD_TESTS=OFF
          cmake --build embsim/build --target embsim_cli
      - name: Configure
        run: cmake --preset avr-uno-embsim -DEMB_EMBSIM="$PWD/embsim/build/bin/embsim"
      - name: Build
        run: cmake --build --preset avr-uno-embsim
      - name: Test on EmbSIM
        run: ctest --preset avr-uno-embsim --output-on-failure --no-tests=error
      - name: Collect case evidence
        # right after the suite: a later ctest run (one test, below) rewrites LastTest.log
        if: always()
        run: python3 -I tools/evidence/collect.py --build build/avr-uno-embsim --preset avr-uno-embsim --out case-evidence-avr-uno-embsim.json
      - name: Decode and symbolize the small record that survived the watchdog reset (tools/crashdec)
        run: |
          ctest --preset avr-uno-embsim -R '^test_crash_reset$' --verbose > crash-reset.log
          python3 -I tools/crashdec/crashdec.py crash-reset.log --tool-prefix avr- \
            --elf build/avr-uno-embsim/tests/conformance/test_crash_reset.elf | tee crashdec.txt
          grep -q "in crash_record_survives_reset at" crashdec.txt
      - name: Upload case evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: case-evidence-avr-uno-embsim
          path: case-evidence-avr-uno-embsim.json
          if-no-files-found: warn

  cm4-embsim:
    # the conformance suite on EmbSIM's NUCLEO-F446RE (SIM-002), built as for the board
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # a hung step fails the job in minutes, not GitHub's six hours
    env:
      # EmbSIM main as of 2026-11-09 (e4616fa): its F446 models the USART's interrupts, which the
      # UART class uses (SPEC-017 §4); emblink/nucleo_f446re and emblink/nucleo_f446ze
      EMBSIM_REF: e4616fa0b97ee9c5444213cec0056b2781a42d5e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EmbLinkOs/EmbSIM
          ref: ${{ env.EMBSIM_REF }}
          path: embsim
      - name: Install tools
        timeout-minutes: 15 # apt has hung for six hours here (#32, #34, #35, #44)
        uses: ./.github/actions/apt-install # archives cached, then scripts/ci-apt-install.sh
        with:
          packages: ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi python3-yaml
      - name: Build EmbSIM
        run: |
          cmake -S embsim -B embsim/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEMBSIM_SERVER=OFF -DEMBSIM_BUILD_TESTS=OFF
          cmake --build embsim/build --target embsim_cli
      - name: Configure
        run: cmake --preset cm4-nucleo-embsim -DEMB_EMBSIM="$PWD/embsim/build/bin/embsim"
      - name: Build
        run: cmake --build --preset cm4-nucleo-embsim
      - name: Test on EmbSIM
        run: ctest --preset cm4-nucleo-embsim --output-on-failure --no-tests=error --verbose
      - name: Collect case evidence
        # right after the suite: a later ctest run (one test, below) rewrites LastTest.log
        if: always()
        run: python3 -I tools/evidence/collect.py --build build/cm4-nucleo-embsim --preset cm4-nucleo-embsim --out case-evidence-cm4-nucleo-embsim.json
      - name: Second STM32F446 board from its description alone, on EmbSIM's NUCLEO-F446ZE (SPEC-014 §11)
        run: |
          cmake --preset cm4-nucleo-f446ze -DEMB_EMBSIM="$PWD/embsim/build/bin/embsim"
          cmake --build --preset cm4-nucleo-f446ze
          ctest --preset cm4-nucleo-f446ze --output-on-failure --no-tests=error
      - name: Upload case evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: case-evidence-cm4-nucleo-embsim
          path: case-evidence-cm4-nucleo-embsim.json
          if-no-files-found: warn

  rv32-embsim:
    # the conformance suite on EmbSIM's ESP32-C3-DevKitM-1 (SIM-002): each image turned into the
    # flash image the board's ROM boots (tools/esp/esp_image.py), run from flash offset 0
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # a hung step fails the job in minutes, not GitHub's six hours
    env:
      # the first EmbSIM commit whose DevKitM-1 runs under the functional policy; main once
      # EmbLinkOs/EmbSIM#54 merges
      EMBSIM_REF: d23519f3d7c1dbf23db97d75314722312082ac33
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EmbLinkOs/EmbSIM
          ref: ${{ env.EMBSIM_REF }}
          path: embsim
      - name: Install tools
        timeout-minutes: 15 # apt has hung for six hours here (#32, #34, #35, #44)
        uses: ./.github/actions/apt-install # archives cached, then scripts/ci-apt-install.sh
        with:
          packages: ninja-build gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf python3-yaml
      - name: Build EmbSIM
        run: |
          cmake -S embsim -B embsim/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEMBSIM_SERVER=OFF -DEMBSIM_BUILD_TESTS=OFF
          cmake --build embsim/build --target embsim_cli
      - name: Configure
        run: cmake --preset rv32-c3-embsim -DEMB_EMBSIM="$PWD/embsim/build/bin/embsim"
      - name: Build
        run: cmake --build --preset rv32-c3-embsim
      - name: Test on EmbSIM
        run: ctest --preset rv32-c3-embsim --output-on-failure --no-tests=error
      - name: Collect case evidence
        if: always()
        run: python3 -I tools/evidence/collect.py --build build/rv32-c3-embsim --preset rv32-c3-embsim --out case-evidence-rv32-c3-embsim.json
      - name: Upload case evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: case-evidence-rv32-c3-embsim
          path: case-evidence-rv32-c3-embsim.json
          if-no-files-found: warn

  # The experimental EmbCC-kernel / GCC-host native build (ADR-041), with the compiler pinned
  # to a release and its digest (docs/engineering/embcc-native-linux.md).
  embcc:
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # a hung step fails the job in minutes, not GitHub's six hours
    strategy:
      fail-fast: false
      matrix:
        preset: [native-embcc, native-embcc-release, native-embcc-tiny, native-embcc-periodic]
    env:
      EMBCC_VERSION: 0.0.1-beta
      EMBCC_SHA256: 984b25acf1b93d61416887530c9589be96b43437a8de8d61ffd07cf6a856551a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        timeout-minutes: 15 # apt has hung for six hours here (#32, #34, #35, #44)
        uses: ./.github/actions/apt-install # archives cached, then scripts/ci-apt-install.sh
        with:
          packages: ninja-build python3-yaml
      # the release archive is cached by version and checksum: a run downloads it only when the
      # cache has none, so GitHub's release downloads failing (502/503/504) does not fail it
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/emb-downloads
          key: embcc-${{ env.EMBCC_VERSION }}-${{ env.EMBCC_SHA256 }}
      - name: Install EmbCC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$HOME/.cache/emb-downloads/embcc-${EMBCC_VERSION}-linux-x86_64.tar.gz"
          mkdir -p "$(dirname "$archive")"
          url="https://github.com/EmbLinkOs/EmbCC/releases/download/v${EMBCC_VERSION}/$(basename "$archive")"
          # authenticated first (GitHub has throttled unauthenticated downloads), then plain HTTPS
          fetch() { gh release download "v${EMBCC_VERSION}" --repo EmbLinkOs/EmbCC --pattern "$(basename "$archive")" \
                      --output "$archive" --clobber ||
                    curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o "$archive" "$url"; }
          check() { echo "${EMBCC_SHA256}  ${archive}" | sha256sum -c -; }
          [ -f "$archive" ] || fetch
          check || { rm -f "$archive"; fetch; check; } # a damaged cached copy is fetched again
          mkdir -p "$HOME/embcc"
          tar -xzf "$archive" -C "$HOME/embcc" --strip-components=1
          "$HOME/embcc/bin/embcc" --version
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DEMB_KERNEL_COMPILER="$HOME/embcc/bin/embcc"
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error

  # The ESP32 probe and the kernel's Xtensa port built by Espressif's own GCC and GNU ld with the
  # same scripts EmbCC's embld reads (ADR-052, ADR-053, ADR-054): a vendor toolchain as a CI leg. The archive is Espressif's
  # release, pinned by the SHA-256 Espressif publishes beside it.
  xtensa-gcc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ESP_GCC_RELEASE: esp-16.1.0_20260609
      ESP_GCC_ARCHIVE: xtensa-esp-elf-16.1.0_20260609-x86_64-linux-gnu.tar.xz
      ESP_GCC_SHA256: f708752ebb35cab21f184b2574114ed1187619db0edb8a4ba913c06ca2fa675e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/emb-downloads
          key: esp-gcc-${{ env.ESP_GCC_RELEASE }}-${{ env.ESP_GCC_SHA256 }}
      - name: Espressif's GCC for Xtensa (pinned, checksum-verified, cached)
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$HOME/.cache/emb-downloads/$ESP_GCC_ARCHIVE"
          mkdir -p "$(dirname "$archive")"
          url="https://github.com/espressif/crosstool-NG/releases/download/$ESP_GCC_RELEASE/$ESP_GCC_ARCHIVE"
          # authenticated first (GitHub has throttled unauthenticated downloads), then plain HTTPS
          fetch() { gh release download "$ESP_GCC_RELEASE" --repo espressif/crosstool-NG --pattern "$ESP_GCC_ARCHIVE" \
                      --output "$archive" --clobber ||
                    curl -sSfL --retry 6 --retry-all-errors --retry-delay 10 -o "$archive" "$url"; }
          check() { echo "$ESP_GCC_SHA256  $archive" | sha256sum -c -; }
          [ -f "$archive" ] || fetch
          check || { rm -f "$archive"; fetch; check; } # a damaged cached copy is fetched again
          tar -xJf "$archive"
          echo "$PWD/xtensa-esp-elf/bin" >> "$GITHUB_PATH"
      - name: Build the ESP32 bring-up probe with it, and check the image
        run: |
          xtensa-esp32-elf-gcc --version | head -1
          XTENSA_GCC=xtensa-esp32-elf-gcc tools/esp/bringup/build.sh build/esp32-gcc
          python3 -I tools/esp/bringup/check_probe.py build/esp32-gcc/esp32_hello.bin
      - name: Install tools
        timeout-minutes: 15
        uses: ./.github/actions/apt-install # archives cached, then scripts/ci-apt-install.sh
        with:
          packages: ninja-build python3-yaml
      - name: Build the kernel port with it, every test and benchmark (esp32_devkitc, ADR-054)
        run: |
          cmake --preset xt-esp32-gcc
          cmake --build --preset xt-esp32-gcc
          ls build/xt-esp32-gcc/tests/conformance/*.bin | wc -l
      - name: Keep the images for a run on the board, flashed and timed by hand (CI has no ESP32)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: esp32-gcc-images
          path: |
            build/xt-esp32-gcc/**/*.elf
            build/xt-esp32-gcc/**/*.bin
          retention-days: 30

  # The kernel's Xtensa port built by Espressif's Clang, its newlib and LLD (ADR-053): the third
  # toolchain for the ESP32 after EmbCC and Espressif's GCC. Each archive is pinned by the SHA-256
  # GitHub records for the release asset.
  xtensa-clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ESP_CLANG_RELEASE: esp-22.1.4_20260825
      ESP_CLANG_VERSION: 22.1.4_20260825
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/emb-downloads
          key: esp-clang-${{ env.ESP_CLANG_RELEASE }} # the step checks each archive's checksum
      - name: Espressif's Clang, newlib and LLD for Xtensa (pinned, checksum-verified, cached)
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="https://github.com/espressif/llvm-project/releases/download/$ESP_CLANG_RELEASE"
          mkdir -p "$HOME/.cache/emb-downloads"
          while read -r sum name; do
            archive="$HOME/.cache/emb-downloads/$name"
            fetch() { gh release download "$ESP_CLANG_RELEASE" --repo espressif/llvm-project --pattern "$name" \
                        --output "$archive" --clobber ||
                      curl -sSfL --retry 6 --retry-all-errors --retry-delay 10 -o "$archive" "$base/$name"; }
            check() { echo "$sum  $archive" | sha256sum -c -; }
            [ -f "$archive" ] || fetch
            check || { rm -f "$archive"; fetch; check; } # a damaged cached copy is fetched again
            tar -xJf "$archive"
          done <<LIST
          4700ed4eb331d70d2e8b0846a233b299f43f958d2ab824ce886764d8bd6eb0a1 clang-esp-${ESP_CLANG_VERSION}-x86_64-linux-gnu.tar.xz
          34fa17a12ccdfc4b23c36928aed81ef6bd52af305a5246edf3712cc59129197b libs-clang-esp-${ESP_CLANG_VERSION}-x86_64-linux-gnu.tar.xz
          62b6b572a0e9c930da0dcb17b642737feafbe1fbbfc207d02d07213d0969b681 lld-esp-${ESP_CLANG_VERSION}-x86_64-linux-gnu.tar.xz
          LIST
          clang_bin=$(dirname "$(find "$PWD" -path '*/bin/clang' \( -type f -o -type l \) | head -1)")
          ls "$clang_bin" | grep -E '^(clang|ld\.lld|llvm-(objcopy|size|nm|ar|ranlib))$'
          echo "$clang_bin" >> "$GITHUB_PATH"
      - name: Install tools
        timeout-minutes: 15
        uses: ./.github/actions/apt-install # archives cached, then scripts/ci-apt-install.sh
        with:
          packages: ninja-build python3-yaml
      - name: Build the kernel port with it, every test and benchmark (esp32_devkitc, ADR-054)
        run: |
          clang --version | head -1
          cmake --preset xt-esp32-clang
          cmake --build --preset xt-esp32-clang
          ls build/xt-esp32-clang/tests/conformance/*.bin | wc -l
      - name: Keep the images for a run on the board, flashed and timed by hand (CI has no ESP32)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: esp32-clang-images
          path: |
            build/xt-esp32-clang/**/*.elf
            build/xt-esp32-clang/**/*.bin
          retention-days: 30

  # bench_compare against ESP-IDF's FreeRTOS on the ESP32 (A96): built in Espressif's ESP-IDF
  # v6.1 container, pinned by digest, and kept for a run on the board, which CI does not have.
  freertos-esp32:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build bench_compare against ESP-IDF's FreeRTOS
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          tools/bench/freertos-esp32/build.sh build/freertos-esp32
      - name: Keep the images for a run on the board, flashed and timed by hand (CI has no ESP32)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freertos-esp32-images
          path: |
            build/freertos-esp32/bootloader/bootloader.bin
            build/freertos-esp32/partition_table/partition-table.bin
            build/freertos-esp32/bench_compare_freertos.bin
            build/freertos-esp32/bench_compare_freertos.elf
            build/freertos-esp32/sdkconfig
          retention-days: 30

  application:
    # applications outside the tree, through find_package(EmbLinkRTOS) (A91): hello_app and
    # blinky built for four boards, run natively and under QEMU until their own end lines
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        timeout-minutes: 15
        uses: ./.github/actions/apt-install # archives cached, then scripts/ci-apt-install.sh
        with:
          packages: ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf qemu-system-misc gcc-avr avr-libc binutils-avr python3-yaml
      - name: Copy the examples out of the tree
        run: |
          cp -r examples/hello_app "$RUNNER_TEMP/hello_app"
          cp -r examples/blinky "$RUNNER_TEMP/blinky"
      - name: Build them for native, the MPS2 AN386, RV32 virt and the Uno
        run: |
          for b in native mps2_an386 riscv32_virt arduino_uno; do
            for app in hello_app blinky; do
              cmake -S "$RUNNER_TEMP/$app" -B "build/$app-$b" -G Ninja \
                    -DEmbLinkRTOS_DIR="$PWD/cmake" -DEMB_BOARD=$b
              cmake --build "build/$app-$b"
            done
          done
      - name: Run it natively and under QEMU
        run: |
          build/hello_app-native/hello | tee hello-native.log
          grep -q "hello_app: done" hello-native.log
          python3 -I tools/qemu/run_qemu.py --qemu qemu-system-arm --until "hello_app: done" --timeout 60 \
            --qemu-args "-M mps2-an386 -semihosting-config enable=on,target=native -kernel" build/hello_app-mps2_an386/hello.elf
          python3 -I tools/qemu/run_qemu.py --qemu qemu-system-riscv32 --until "hello_app: done" --timeout 60 \
            --qemu-args "-M virt -bios none -kernel" build/hello_app-riscv32_virt/hello.elf
      - name: Run blinky natively, where it stops after ten toggles, and under QEMU, where it blinks on
        run: |
          build/blinky-native/blinky | tee blinky-native.log
          test "$(grep -c '^blinky: ' blinky-native.log)" -eq 10
          python3 -I tools/qemu/run_qemu.py --qemu qemu-system-arm --until "blinky: off" --timeout 60 \
            --qemu-args "-M mps2-an386 -semihosting-config enable=on,target=native -kernel" build/blinky-mps2_an386/blinky.elf
          python3 -I tools/qemu/run_qemu.py --qemu qemu-system-riscv32 --until "blinky: off" --timeout 60 \
            --qemu-args "-M virt -bios none -kernel" build/blinky-riscv32_virt/blinky.elf
      - name: Build the reference controller for both NUCLEO-F446 boards (it runs on the board, not here)
        run: |
          cp -r examples/controller "$RUNNER_TEMP/controller"
          for b in nucleo_f446re nucleo_f446ze; do
            cmake -S "$RUNNER_TEMP/controller" -B "build/controller-$b" -G Ninja \
                  -DEmbLinkRTOS_DIR="$PWD/cmake" -DEMB_BOARD=$b
            cmake --build "build/controller-$b"
          done
      - name: The controller's static stack bound and memory accounting (KRN-MEM-009)
        run: |
          for b in nucleo_f446re nucleo_f446ze; do
            python3 -I tools/footprint/stack_bound.py --elf "build/controller-$b/controller.elf" \
                    --build "build/controller-$b" --roots examples/controller/stack-roots.json
            python3 -I tools/footprint/memory_report.py "build/controller-$b/controller.elf.map" \
                    --elf "build/controller-$b/controller.elf"
          done
      - name: The controller's stack bound in a release build with LTO, where GCC inlines across files
        run: |
          cmake -S "$RUNNER_TEMP/controller" -B build/controller-lto -G Ninja -DEmbLinkRTOS_DIR="$PWD/cmake" \
                -DEMB_BOARD=nucleo_f446re -DEMB_SET=EMB_CHECKED=n -DEMB_LTO=ON
          cmake --build build/controller-lto
          python3 -I tools/footprint/stack_bound.py --elf build/controller-lto/controller.elf \
                  --build build/controller-lto --roots examples/controller/stack-roots.json
      - name: The controller's SBOM (REL-001, BLD-003), checked by the SPDX tools
        run: |
          python3 -m venv "$RUNNER_TEMP/spdx"
          "$RUNNER_TEMP/spdx/bin/pip" install --quiet spdx-tools==0.8.5
          for b in nucleo_f446re nucleo_f446ze; do
            python3 -I tools/sbom/sbom.py --build "build/controller-$b" --elf "build/controller-$b/controller.elf" \
                    --out "sbom-controller-$b.spdx.json"
            "$RUNNER_TEMP/spdx/bin/pyspdxtools" -i "sbom-controller-$b.spdx.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-controller
          path: sbom-controller-*.spdx.json

  evidence:
    # TEST-009: the requirement matrix from every job's case evidence (tools/evidence/matrix.py),
    # gated against tools/evidence/baseline.json: a configuration that loses a requirement an
    # executed case passed for, or has no evidence, fails; a case that cites an unknown
    # requirement or fails does too. New evidence passes and is reported.
    if: ${{ !cancelled() }}
    needs: [native, cortex_m, riscv, clang-cross, avr, avr-embsim, cm4-embsim, rv32-embsim]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: case-evidence-*
          merge-multiple: true
          path: evidence
      - name: Requirement matrix against the baseline
        run: |
          python3 -I tools/evidence/matrix.py evidence/*.json --baseline tools/evidence/baseline.json \
            --csv requirement-matrix.csv --json requirement-matrix.json \
            --write-baseline requirement-baseline-now.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: requirement-matrix
          path: requirement-*

  static-analysis:
    # clang-tidy 18 with the root .clang-tidy, and cppcheck 2.22.0 with the root
    # .cppcheck-suppressions, over the product code (CODING-STANDARD §12, §13; 05 §5), in every
    # configuration that selects different code: native profiles and clock modes, each Cortex-M
    # architecture, RV32, AVR, the NUCLEO and Pico 2 W boards and the reference controller's
    # drivers. A finding fails the job; it is fixed or recorded at its site as a deviation.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CPPCHECK_VERSION: 2.22.0
      CPPCHECK_SHA256: d74945deb2d50393430e07596b766f8a779512c7f60dac2a30ea64e059ece57b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        timeout-minutes: 15 # apt has hung for six hours here (#32, #34, #35, #44)
        uses: ./.github/actions/apt-install # archives cached, then scripts/ci-apt-install.sh
        with:
          packages: ninja-build clang clang-tidy-18 lld gcc-arm-none-eabi libnewlib-arm-none-eabi gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf gcc-avr avr-libc binutils-avr python3-yaml
      - name: Configure and build with Clang
        run: |
          clang --version | head -1
          clang-tidy-18 --version | head -2
          for p in native-clang cm0-microbit-clang cm4-an386-clang cm4-an386-release-clang cm33-an505-clang rv32-virt-clang avr-uno-clang; do
            cmake --preset "$p" > /dev/null
            cmake --build --preset "$p"
          done
          # the native profiles and clock modes, and the boards, built by Clang (their presets use GCC)
          for p in native-tiny native-release native-periodic native-timeslice-tickless; do
            cmake --preset "$p" -B "build/$p-tidy" -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ > /dev/null
            cmake --build "build/$p-tidy"
          done
          tc="$PWD/cmake/toolchains/arm-none-eabi-clang.cmake"
          for p in cm4-nucleo-embsim cm33-pico2w; do
            cmake --preset "$p" -B "build/$p-tidy" -DCMAKE_TOOLCHAIN_FILE="$tc" > /dev/null
            cmake --build "build/$p-tidy"
          done
          cmake -S examples/controller -B build/controller-tidy -G Ninja -DEMB_BOARD=nucleo_f446re \
                -DCMAKE_TOOLCHAIN_FILE="$tc" > /dev/null
          cmake --build build/controller-tidy
      - name: The Clang controller's stack bound
        run: |
          python3 -I tools/footprint/stack_bound.py --elf build/controller-tidy/controller.elf \
                  --build build/controller-tidy --roots examples/controller/stack-roots.json
      - name: The Clang controller's memory report, from LLD's map
        run: |
          python3 -I tools/footprint/memory_report.py build/controller-tidy/controller.elf.map \
                  --elf build/controller-tidy/controller.elf
      - name: clang-tidy
        run: |
          python3 -I tools/analysis/clang_tidy.py --clang-tidy clang-tidy-18 \
            build/native-clang build/native-tiny-tidy build/native-release-tidy build/native-periodic-tidy \
            build/native-timeslice-tickless-tidy build/cm0-microbit-clang build/cm4-an386-clang \
            build/cm4-an386-release-clang build/cm33-an505-clang build/rv32-virt-clang build/avr-uno-clang \
            build/cm4-nucleo-embsim-tidy build/cm33-pico2w-tidy build/controller-tidy
      # cppcheck built from its tagged source, pinned by checksum; Ubuntu 24.04 ships 2.13, and
      # versions differ in what they report. The build is cached by version and checksum.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: ~/cppcheck
          key: cppcheck-${{ env.CPPCHECK_VERSION }}-${{ env.CPPCHECK_SHA256 }}-ubuntu-24.04
      - name: Install cppcheck
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -x "$HOME/cppcheck/bin/cppcheck" ]; then
            archive="$RUNNER_TEMP/cppcheck-${CPPCHECK_VERSION}.tar.gz"
            url="https://github.com/danmar/cppcheck/archive/refs/tags/${CPPCHECK_VERSION}.tar.gz"
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -H "Authorization: Bearer $GH_TOKEN" \
                 -o "$archive" "$url"
            echo "${CPPCHECK_SHA256}  ${archive}" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/cppcheck-src"
            tar -xzf "$archive" -C "$RUNNER_TEMP/cppcheck-src" --strip-components=1
            cmake -S "$RUNNER_TEMP/cppcheck-src" -B "$RUNNER_TEMP/cppcheck-build" -G Ninja \
                  -DCMAKE_BUILD_TYPE=Release -DUSE_MATCHCOMPILER=On -DHAVE_RULES=Off -DBUILD_GUI=Off \
                  -DBUILD_TESTING=Off -DCMAKE_INSTALL_PREFIX="$HOME/cppcheck" > /dev/null
            cmake --build "$RUNNER_TEMP/cppcheck-build"
            cmake --install "$RUNNER_TEMP/cppcheck-build" > /dev/null
          fi
          "$HOME/cppcheck/bin/cppcheck" --version
      # cppcheck's own checks fail on any finding; its MISRA addon (rule numbers only, the texts
      # are MISRA's) fails on a file that gains a finding of a rule over the baseline
      - name: cppcheck and its MISRA addon
        if: ${{ !cancelled() }}
        run: |
          python3 -I tools/analysis/cppcheck.py --cppcheck "$HOME/cppcheck/bin/cppcheck" \
            --misra --misra-baseline tools/analysis/misra-baseline.json \
            --write-misra-baseline misra-baseline-now.json \
            build/native-clang build/native-tiny-tidy build/native-release-tidy build/native-periodic-tidy \
            build/native-timeslice-tickless-tidy build/cm0-microbit-clang build/cm4-an386-clang \
            build/cm4-an386-release-clang build/cm33-an505-clang build/rv32-virt-clang build/avr-uno-clang \
            build/cm4-nucleo-embsim-tidy build/cm33-pico2w-tidy build/controller-tidy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: misra-baseline-now
          path: misra-baseline-now.json

  reproducibility:
    # BLD-004's double build: the same commit, checked out a second time at another path, must
    # give byte-identical images (tools/repro/double_build.py). Native programs, Cortex-M with GCC
    # and Clang, RV32, AVR, the Pico 2 W's UF2 images and the reference controller.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        timeout-minutes: 15 # apt has hung for six hours here (#32, #34, #35, #44)
        uses: ./.github/actions/apt-install # archives cached, then scripts/ci-apt-install.sh
        with:
          packages: ninja-build clang lld gcc-arm-none-eabi libnewlib-arm-none-eabi gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf gcc-avr avr-libc binutils-avr python3-yaml
      - name: Double build
        run: |
          python3 -I tools/repro/double_build.py --work "$RUNNER_TEMP/repro" \
            --preset native-gcc --preset native-clang --preset cm4-an386 --preset cm4-an386-clang \
            --preset rv32-virt --preset avr-uno --preset cm33-pico2w \
            --app examples/controller:nucleo_f446re --app examples/controller:nucleo_f446re+EMB_LTO=ON

  merge_gate:
    name: CI merge gate
    if: ${{ always() }}
    needs: [native, cortex_m, riscv, clang-cross, lto, avr, avr-embsim, cm4-embsim, rv32-embsim, embcc, xtensa-gcc, xtensa-clang, application, lint, evidence, static-analysis, reproducibility]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every matrix and lint job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          results = json.loads(os.environ['NEEDS_JSON'])
          failed = {name: job['result'] for name, job in results.items()
                    if job['result'] != 'success'}
          if not results or failed:
              print('CI merge gate failed:', failed or 'no dependency results')
              sys.exit(1)
          print('CI merge gate: every required matrix and lint job succeeded')
          PY

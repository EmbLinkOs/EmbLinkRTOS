# Build matrix of 05 §2.2 and §5: native GCC and Clang (checked, release, tiny, sanitizers),
# Cortex-M with arm-none-eabi-gcc and RISC-V with riscv64-unknown-elf-gcc run under QEMU,
# AVR with avr-gcc run under QEMU and on EmbSIM's Arduino Uno, the Cortex-M4F suite on EmbSIM's
# NUCLEO-F446RE (SIM-002), formatting, and the footprint gate (TEST-011).
# Target order: Cortex-M and RISC-V first, AVR secondary (ADR-038).
# The EmbCC legs join when the compiler is available to CI (09 §11).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  native:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [native-gcc, native-clang, native-release, native-tiny, native-periodic, native-asan, native-tsan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang python3-yaml
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error
      - name: Preserve differential failure bundles
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differential-failures-${{ matrix.preset }}
          path: build/differential-failures/
          if-no-files-found: ignore

  cortex_m:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [cm3-an385, cm4-an386, cm4-an386-release, cm4-an386-tiny]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm python3-yaml
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test under QEMU
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error --verbose
      - name: Footprint report
        run: |
          python3 -I tools/footprint/footprint.py \
            build/${{ matrix.preset }}/samples/first_execution/first_execution.elf.map \
            --elf build/${{ matrix.preset }}/samples/first_execution/first_execution.elf --nm arm-none-eabi-nm \
            --title "${{ matrix.preset }}" --json footprint-${{ matrix.preset }}.json | tee footprint-${{ matrix.preset }}.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: footprint-${{ matrix.preset }}
          path: footprint-${{ matrix.preset }}.*

  riscv:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [rv32-virt, rv32-virt-release, rv32-virt-tiny]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf qemu-system-misc python3-yaml
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test under QEMU
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error
      - name: Footprint report
        run: |
          python3 -I tools/footprint/footprint.py \
            build/${{ matrix.preset }}/samples/first_execution/first_execution.elf.map \
            --elf build/${{ matrix.preset }}/samples/first_execution/first_execution.elf --nm riscv64-unknown-elf-nm \
            --title "${{ matrix.preset }}" --json footprint-${{ matrix.preset }}.json | tee footprint-${{ matrix.preset }}.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: footprint-${{ matrix.preset }}
          path: footprint-${{ matrix.preset }}.*

  avr:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: avr-uno
            sample: first_execution
          - preset: avr-uno-release
            sample: first_execution
          - preset: avr-uno-t1
            sample: footprint_t1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-avr avr-libc binutils-avr qemu-system-misc python3-yaml
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test under QEMU
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error
      - name: Footprint
        run: |
          python3 -I tools/footprint/footprint.py \
            build/${{ matrix.preset }}/samples/${{ matrix.sample }}/${{ matrix.sample }}.elf.map \
            --elf build/${{ matrix.preset }}/samples/${{ matrix.sample }}/${{ matrix.sample }}.elf --nm avr-nm \
            --title "${{ matrix.preset }}" --json footprint-${{ matrix.preset }}.json \
            --thresholds tools/footprint/thresholds-${{ matrix.preset }}.json | tee footprint-${{ matrix.preset }}.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: footprint-${{ matrix.preset }}
          path: footprint-${{ matrix.preset }}.*

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 python3-yaml
      - name: clang-format
        run: |
          find include kernel arch boards samples tests \( -name '*.c' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format-18 --dry-run -Werror
      - name: Banned constructs
        run: python3 -I scripts/check-banned.py
      - name: Storage marker contract
        run: python3 -I -m unittest discover -s tools/storage -p 'test_*.py' -v
      - name: Mixed native compiler launcher contract
        run: python3 -I -m unittest discover -s tools/toolchain -p 'test_*.py' -v
      - name: Configuration tool self-check
        run: |
          python3 -I tools/kconfig/embconfig.py --kconfig Kconfig --manifest arch/native/arch.yaml \
            --conf boards/native/native/board.conf --conf configs/base.conf --print > /dev/null
          python3 -I tools/kconfig/embconfig.py --kconfig Kconfig --manifest arch/avr/arch.yaml \
            --conf boards/arduino/arduino_uno/board.conf --conf configs/tiny.conf --print > /dev/null
      - name: IRQ configuration and encoding regressions
        run: python3 -I -m unittest discover -s tools/kconfig -p 'test_*.py' -v
      - name: Reference model
        run: |
          pip install hypothesis pytest
          cd tools/model && python3 -m pytest -q

  avr-embsim:
    # the conformance suite on EmbSIM's Arduino Uno (SIM-002): EmbSIM built from source,
    # each test image run in virtual time until its EMB_TEST_END (tools/embsim/run_embsim.py)
    runs-on: ubuntu-24.04
    env:
      EMBSIM_REF: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EmbLinkOs/EmbSIM
          ref: ${{ env.EMBSIM_REF }}
          path: embsim
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-avr avr-libc binutils-avr python3-yaml
      - name: Build EmbSIM
        run: |
          cmake -S embsim -B embsim/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEMBSIM_SERVER=OFF -DEMBSIM_BUILD_TESTS=OFF
          cmake --build embsim/build --target embsim_cli
      - name: Configure
        run: cmake --preset avr-uno-embsim -DEMB_EMBSIM="$PWD/embsim/build/bin/embsim"
      - name: Build
        run: cmake --build --preset avr-uno-embsim
      - name: Test on EmbSIM
        run: ctest --preset avr-uno-embsim --output-on-failure --no-tests=error

  cm4-embsim:
    # the conformance suite on EmbSIM's NUCLEO-F446RE (SIM-002), built as for the board
    runs-on: ubuntu-24.04
    env:
      # the first EmbSIM commit with emblink/nucleo_f446re complete enough for the suite; main
      # once EmbLinkOs/EmbSIM#54 merges
      EMBSIM_REF: c52829326e4e2477e751f41f3532b7a021f60fb7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EmbLinkOs/EmbSIM
          ref: ${{ env.EMBSIM_REF }}
          path: embsim
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi python3-yaml
      - name: Build EmbSIM
        run: |
          cmake -S embsim -B embsim/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEMBSIM_SERVER=OFF -DEMBSIM_BUILD_TESTS=OFF
          cmake --build embsim/build --target embsim_cli
      - name: Configure
        run: cmake --preset cm4-nucleo-embsim -DEMB_EMBSIM="$PWD/embsim/build/bin/embsim"
      - name: Build
        run: cmake --build --preset cm4-nucleo-embsim
      - name: Test on EmbSIM
        run: ctest --preset cm4-nucleo-embsim --output-on-failure --no-tests=error --verbose

  merge_gate:
    name: CI merge gate
    if: ${{ always() }}
    needs: [native, cortex_m, riscv, avr, avr-embsim, cm4-embsim, lint]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every matrix and lint job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          results = json.loads(os.environ['NEEDS_JSON'])
          failed = {name: job['result'] for name, job in results.items()
                    if job['result'] != 'success'}
          if not results or failed:
              print('CI merge gate failed:', failed or 'no dependency results')
              sys.exit(1)
          print('CI merge gate: every required matrix and lint job succeeded')
          PY

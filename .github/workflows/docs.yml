name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish site (requires GitHub Pages source set to GitHub Actions)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Documentation build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: |
          python -m pip install -r docs/requirements.txt
          python tools/docs/bootstrap.py
      - name: Build complete documentation with warnings as errors
        run: |
          python -m unittest discover -s tools/docs -p 'test_*.py' -v
          python tools/docs/build.py
      - name: Check source preservation
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: |
            build/docs/html/
            build/docs/catalog/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          path: build/docs/html

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: documentation-pages
      cancel-in-progress: false
    steps:
      - name: Publish reviewed documentation
        id: deployment
        uses: actions/deploy-pages@v4

# The SVD importer's table for Raspberry Pi (hw/import/svd.py): the RP2350's peripherals the
# family board support drives. Its SVD gives no group names, so rules match peripheral names.
schema_version: 0
vendor: rpi
rules:
  - { name: UART0, compatible: "arm,pl011" }
  - { name: UART1, compatible: "arm,pl011" }
  - { name: CLOCKS, family: rp2350, compatible: "rpi,rp2350-clocks" }
  - { name: RESETS, family: rp2350, compatible: "rpi,rp2350-resets" }
  - { name: IO_BANK0, family: rp2350, compatible: "rpi,rp2350-io-bank" }
  - { name: PADS_BANK0, family: rp2350, compatible: "rpi,rp2350-pads" }
  - { name: XOSC, family: rp2350, compatible: "rpi,rp2350-xosc" }
  - { name: SIO, family: rp2350, compatible: "rpi,rp2350-sio" }

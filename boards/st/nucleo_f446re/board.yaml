# Board description (SPEC-014 §4): NUCLEO-F446RE, MB1136 C-03 (UM1724). emb-hwgen turns it
# into generated/ (hw/gen/emb-hwgen.py generate --board boards/st/nucleo_f446re).
schema_version: 0
kind: board
name: nucleo_f446re
vendor: st
revision: MB1136 C-03
soc: st/stm32f4/stm32f446re.yaml
curated: true
doc: >-
  The STM32F446RE at 180 MHz from the PLL, its input the ST-LINK's 8 MHz MCO on PH0 in HSE
  bypass (solder bridges SB16 and SB50 as shipped). The console is USART2, which the ST-LINK
  carries as its virtual COM port.
oscillators:
  hse: { hz: 8MHz, source: external_clock }   # the ST-LINK's MCO through SB16/SB50 (UM1724 §6.7.1)
  lse: { hz: 32768, source: external_crystal } # X2
clocks:
  cpu_hz: 180MHz
  source: hse
  # kept as first brought up: VCO input 1 MHz, VCO 360 MHz, Q 7 (no USB on this board)
  pll: { m: 8, n: 360, p: 2, q: 7, r: 2 }
pins:
  usart2: { tx: PA2.af7, rx: PA3.af7 }
  uart4: { tx: PA0.af8, rx: PA1.af8 }    # A0 and A1 on the Arduino header
  spi2: { sck: PB13.af5, miso: PB14.af5, mosi: PB15.af5 } # CN10-30, -28 and -26
console: { device: usart2, baud: 115200 }
# the board's devices (SPEC-016), initialized with the EARLY devices: the clock tree, the
# GPIO ports in use and the console
devices:
  - { name: rcc }
  - { name: gpioa, doc: "the console's pins and LD2" }
  - { name: gpioc, doc: B1 }
  - { name: usart2, baud: 115200, doc: "the console, the ST-LINK's virtual COM port" }
  - { name: spi2, doc: "SPI2 on PB13 to PB15; the HIL suite's loopback wires PB15 (MOSI) to PB14 (MISO)" }
  - { name: uart4, baud: 115200, doc: "a spare UART; the HIL suite's loopback wires A0 (PA0, TX) to A1 (PA1, RX)" }
leds: [ { name: user, gpio: PA5, active: high, doc: LD2 } ]
buttons: [ { name: user, gpio: PC13, active: low, doc: B1 } ]
flash_partitions:
  - { name: app, base: 0x08000000, size: 512K }
# the conformance framework's software interrupts: lines with no peripheral behind them
test_irqs: [61, 62]
debug_probe: { openocd: board/st_nucleo_f4.cfg, pyocd_target: stm32f446retx }
simulation:
  embsim: emblink/nucleo_f446re
  resets_in: [embsim, hil]
  # EmbSIM's board wires A0 to A1 as the bench does, for test_uart_loop
  loopbacks:
    - { device: uart4, ports: [A0, A1] }
    - { device: spi2, ports: [CN10_26, CN10_28] } # PB15 (MOSI) to PB14 (MISO)
defaults: { CONFIG_EMB_PROFILE: base, CONFIG_EMB_TICK_NS: 1000000 }

# Tasks (SPEC-020) in MPLAB Harmony's form (A130): a door, driven by events with a state's
# timeout, and a blinker, by its period. hw/gen/emb-hwgen.py generate --system
# examples/tasks/system.yaml writes the application's CMakeLists.txt, src/main.c and each task's
# src/<task>.c and .h, then each board's configuration folder, src/config/<board>/.
schema_version: 0
kind: system
name: tasks_demo
boards: [st/nucleo_f446re, rpi/pico2_w]
tasks:
  - name: door
    model: event
    priority: 5
    stack: 1K
    queue: 8
    events: [open, close, jam]
    states: [closed, open, jammed]
    initial: closed
    entry: [open]
    exit: [open]
    timeout: { open: 2s }
  - name: blink
    model: periodic
    period: 500ms
    priority: 2
    stack: 512
    states: [dark, lit]
    initial: dark
# the application's own interrupt (A130): a line no peripheral raises on either SoC (the F446's
# 61, the RP2350's SPAREIRQ_IRQ_0); the blinker raises it every fourth blink, and its handler
# opens the door
interrupts:
  - name: wake
    irq: { nucleo_f446re: 61, pico2_w: 46 }
    handler: WAKE_InterruptHandler
    level: 1

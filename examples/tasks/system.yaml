# Tasks (SPEC-020): a door, driven by events with a state's timeout, and a blinker, by its
# period. hw/gen/emb-hwgen.py generate --system examples/tasks/system.yaml writes the
# application's CMakeLists.txt, src/main.c and src/tasks/, then generated/<board>/.
schema_version: 0
kind: system
name: tasks_demo
boards: [st/nucleo_f446re, rpi/pico2_w]
tasks:
  - name: door
    model: event
    priority: 5
    stack: 1K
    queue: 8
    events: [open, close, jam]
    states: [closed, open, jammed]
    initial: closed
    entry: [open]
    exit: [open]
    timeout: { open: 2s }
    data: door_data_t
  - name: blink
    model: periodic
    period: 500ms
    priority: 2
    stack: 512
    states: [dark, lit]
    initial: dark

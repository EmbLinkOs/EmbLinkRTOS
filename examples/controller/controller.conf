# The reference controller: a kernel fault records the crash and reboots the part, so the next
# boot reports it (docs/adoption.md: diagnostics for an injected failure).
CONFIG_EMB_FAULT_ACTION_REBOOT=y
# No breakpoint first: the ST-LINK leaves the core's debug enable set after flashing, so a
# breakpoint would halt the part, and the halted core freezes the watchdog (DBGMCU), instead of
# the reboot a deployed controller needs.
CONFIG_EMB_FAULT_HALT_FOR_DEBUG=n
CONFIG_EMB_CRASH_RECORD=y
CONFIG_EMB_FAULT_WHERE=y
# every thread's stack high-water mark, for the status command's memory accounting (KRN-MEM-009)
CONFIG_EMB_STACK_STATS=y

# The STM32F446 die (SPEC-014 §3): memory, interrupts, buses and the peripherals the drivers
# use, from RM0390 Rev 6, the STM32F446xC/E datasheet (DS10693) and ST's STM32F446 SVD 1.9.
# A package file (stm32f446re.yaml, stm32f446ze.yaml) adds the bonded pins.
schema_version: 0
kind: soc
name: stm32f446
vendor: st
family: stm32f4
extends: stm32f4.yaml
abstract: true
curated: true
memory:
  regions:
    - { name: flash, base: 0x08000000, size: 512K, attrs: [r, x, boot] }
    - { name: sram1, base: 0x20000000, size: 112K, attrs: [r, w, x, dma] }
    - { name: sram2, base: 0x2001C000, size: 16K, attrs: [r, w, x, dma] }
    - { name: bkpsram, base: 0x40024000, size: 4K, attrs: [r, w, retained] }
clocks:
  # RM0390 §6.2: the AHB and APB limits; enable_offset is the bus's RCC clock-enable register
  buses:
    - { name: ahb1, max_hz: 180MHz, from: hclk, enable_offset: 0x30 }
    - { name: apb1, max_hz: 45MHz, from: pclk1, enable_offset: 0x40 }
    - { name: apb2, max_hz: 90MHz, from: pclk2, enable_offset: 0x44 }
  # RM0390 §5.1.4, PWR_CR.VOS: in order of preference (lowest power first)
  voltage_scales:
    - { name: scale3, vos: 1, max_hz: 120MHz }
    - { name: scale2, vos: 2, max_hz: 144MHz, overdrive_max_hz: 168MHz }
    - { name: scale1, vos: 3, max_hz: 168MHz, overdrive_max_hz: 180MHz }
interrupts:
  count: 97
  # vector lines with no peripheral behind them (RM0390 Table 38): free for software use
  reserved: [61, 62, 79, 80, 81, 82, 83, 85, 86, 88, 89, 90]
peripherals:
  # ADC1 (RM0390 §13): 12 bits, inputs 0 to 15 on pins, the temperature sensor on 18 and VREFINT
  # on 17 (§13.10, §13.11); its global interrupt line is shared by ADC1 to ADC3; its results by
  # DMA2 stream 0 or 4, channel 0 (Table 29)
  - { name: adc1, compatible: "st,stm32f4-adc", base: 0x40012000, size: 0x100, clock: { bus: apb2, bit: 8 },
      adc: { bits: 12, inputs: 16, temperature: 18, vrefint: 17 },
      irqs: [ { name: global, number: 18 } ],
      dma_requests: { rx: [dma2.s0c0, dma2.s4c0] } }
  # the ADCs' common registers (RM0390 §13.13.16): the prescaler, the temperature sensor's enable
  - { name: adc_common, compatible: "st,stm32f4-adc-common", base: 0x40012300, size: 0x100 }
  # factory calibration in system memory (DS10693 §6.3.22, §6.3.23): VREFINT_CAL at +0, the
  # temperature sensor's TS_CAL1 (30 C) at +2 and TS_CAL2 (110 C) at +4, each a 12-bit ADC
  # reading at VDDA = 3.3 V
  - { name: factory_cal, compatible: "st,stm32f4-factory-cal", base: 0x1FFF7A2A, size: 6 }
  - { name: flash_if, compatible: "st,stm32f4-flash", base: 0x40023C00, size: 0x400,
      irqs: [ { name: global, number: 4 } ] }
  - { name: gpioa, compatible: "st,stm32-gpio", base: 0x40020000, size: 0x400, port: A, clock: { bus: ahb1, bit: 0 } }
  - { name: gpiob, compatible: "st,stm32-gpio", base: 0x40020400, size: 0x400, port: B, clock: { bus: ahb1, bit: 1 } }
  - { name: gpioc, compatible: "st,stm32-gpio", base: 0x40020800, size: 0x400, port: C, clock: { bus: ahb1, bit: 2 } }
  - { name: gpiod, compatible: "st,stm32-gpio", base: 0x40020C00, size: 0x400, port: D, clock: { bus: ahb1, bit: 3 } }
  - { name: gpioe, compatible: "st,stm32-gpio", base: 0x40021000, size: 0x400, port: E, clock: { bus: ahb1, bit: 4 } }
  - { name: gpiof, compatible: "st,stm32-gpio", base: 0x40021400, size: 0x400, port: F, clock: { bus: ahb1, bit: 5 } }
  - { name: gpiog, compatible: "st,stm32-gpio", base: 0x40021800, size: 0x400, port: G, clock: { bus: ahb1, bit: 6 } }
  - { name: gpioh, compatible: "st,stm32-gpio", base: 0x40021C00, size: 0x400, port: H, clock: { bus: ahb1, bit: 7 } }
  # the independent watchdog (RM0390 §19), clocked by the 32 kHz LSI, no clock gate
  - { name: iwdg, compatible: "st,stm32f4-iwdg", base: 0x40003000, size: 0x400 }
  # the RTC (RM0390 §26) in the backup domain, its clock the board's LSE; alarm A through EXTI
  # line 17 to RTC_Alarm (position 41)
  - { name: rtc, compatible: "st,stm32f4-rtc", base: 0x40002800, size: 0x400,
      irqs: [ { name: alarm, number: 41 } ] }
  # the external interrupt controller (RM0390 §10.3); the RTC's alarm is its line 17
  - { name: exti, compatible: "st,stm32f4-exti", base: 0x40013C00, size: 0x400 }
  - { name: pwr, compatible: "st,stm32f4-pwr", base: 0x40007000, size: 0x400, clock: { bus: apb1, bit: 28 },
      irqs: [ { name: pvd, number: 1 } ] }
  - { name: rcc, compatible: "st,stm32f4-rcc", base: 0x40023800, size: 0x400,
      irqs: [ { name: global, number: 5 } ] }
  # TIM2, a 32-bit general-purpose timer on APB1 (RM0390 §17): its update event is ADC1's trigger
  - { name: tim2, compatible: "st,stm32-tim", base: 0x40000000, size: 0x400, counter_bits: 32,
      clock: { bus: apb1, bit: 0 },
      irqs: [ { name: global, number: 28 } ] }
  # TIM3 and TIM4, 16-bit, and TIM5, 32-bit, the same general-purpose timers on APB1 (RM0390 §17,
  # Table 38): four channels each, for PWM, capture and compare
  - { name: tim3, compatible: "st,stm32-tim", base: 0x40000400, size: 0x400, counter_bits: 16,
      clock: { bus: apb1, bit: 1 },
      irqs: [ { name: global, number: 29 } ] }
  - { name: tim4, compatible: "st,stm32-tim", base: 0x40000800, size: 0x400, counter_bits: 16,
      clock: { bus: apb1, bit: 2 },
      irqs: [ { name: global, number: 30 } ] }
  - { name: tim5, compatible: "st,stm32-tim", base: 0x40000C00, size: 0x400, counter_bits: 32,
      clock: { bus: apb1, bit: 3 },
      irqs: [ { name: global, number: 50 } ] }
  # TIM9, a 16-bit general-purpose timer on APB2 with two channels (RM0390 §18): the same
  # registers as TIM2's but CCMR2, CCR3 and CCR4; its interrupt is shared with TIM1's break
  - { name: tim9, compatible: "st,stm32-tim", base: 0x40014000, size: 0x400, counter_bits: 16,
      timer_channels: 2, clock: { bus: apb2, bit: 16 },
      irqs: [ { name: global, number: 24 } ] }
  # the DMA controllers (RM0390 §9), on AHB1, an interrupt per stream (SVD 1.9): each request on
  # the streams Tables 28 and 29 list it on, with its channel select (dma_requests: A119, the
  # tables cross-checked with EmbSIM's STM32F446 model); DMA2 alone copies memory to memory
  - { name: dma1, compatible: "st,stm32-dma", base: 0x40026000, size: 0x400, clock: { bus: ahb1, bit: 21 },
      irqs: [ { name: s0, number: 11 }, { name: s1, number: 12 }, { name: s2, number: 13 }, { name: s3, number: 14 },
              { name: s4, number: 15 }, { name: s5, number: 16 }, { name: s6, number: 17 }, { name: s7, number: 47 } ],
      dma: { kind: fixed, channels: 8, max_count: 65535, memory: false } }
  - { name: dma2, compatible: "st,stm32-dma", base: 0x40026400, size: 0x400, clock: { bus: ahb1, bit: 22 },
      irqs: [ { name: s0, number: 56 }, { name: s1, number: 57 }, { name: s2, number: 58 }, { name: s3, number: 59 },
              { name: s4, number: 60 }, { name: s5, number: 68 }, { name: s6, number: 69 }, { name: s7, number: 70 } ],
      dma: { kind: fixed, channels: 8, max_count: 65535, memory: true } }
  # the I2C controllers (RM0390 §24), on APB1, each with an event and an error interrupt (SVD 1.9)
  - { name: i2c1, compatible: "st,stm32-i2c", base: 0x40005400, size: 0x400, clock: { bus: apb1, bit: 21 },
      irqs: [ { name: ev, number: 31 }, { name: er, number: 32 } ],
      dma_requests: { tx: [dma1.s6c1, dma1.s7c1], rx: [dma1.s0c1, dma1.s5c1] } }
  - { name: i2c2, compatible: "st,stm32-i2c", base: 0x40005800, size: 0x400, clock: { bus: apb1, bit: 22 },
      irqs: [ { name: ev, number: 33 }, { name: er, number: 34 } ],
      dma_requests: { tx: dma1.s7c7, rx: [dma1.s2c7, dma1.s3c7] } }
  - { name: i2c3, compatible: "st,stm32-i2c", base: 0x40005C00, size: 0x400, clock: { bus: apb1, bit: 23 },
      irqs: [ { name: ev, number: 72 }, { name: er, number: 73 } ],
      dma_requests: { tx: dma1.s4c3, rx: [dma1.s1c1, dma1.s2c3] } }
  # SPI2 (RM0390 §26), on APB1; its pins PB13 to PB15 keep PA5, the NUCLEO's LED, free
  - { name: spi2, compatible: "st,stm32-spi", base: 0x40003800, size: 0x400, clock: { bus: apb1, bit: 14 },
      irqs: [ { name: global, number: 36 } ],
      dma_requests: { tx: dma1.s4c0, rx: dma1.s3c0 } }
  - { name: uart4, compatible: "st,stm32-usart", base: 0x40004C00, size: 0x400, clock: { bus: apb1, bit: 19 },
      irqs: [ { name: global, number: 52 } ],
      dma_requests: { tx: dma1.s4c4, rx: dma1.s2c4 } }
  - { name: uart5, compatible: "st,stm32-usart", base: 0x40005000, size: 0x400, clock: { bus: apb1, bit: 20 },
      irqs: [ { name: global, number: 53 } ],
      dma_requests: { tx: dma1.s7c4, rx: dma1.s0c4 } }
  - { name: usart1, compatible: "st,stm32-usart", base: 0x40011000, size: 0x400, clock: { bus: apb2, bit: 4 },
      irqs: [ { name: global, number: 37 } ],
      dma_requests: { tx: dma2.s7c4, rx: [dma2.s2c4, dma2.s5c4] } }
  - { name: usart2, compatible: "st,stm32-usart", base: 0x40004400, size: 0x400, clock: { bus: apb1, bit: 17 },
      irqs: [ { name: global, number: 38 } ],
      dma_requests: { tx: dma1.s6c4, rx: dma1.s5c4 } }
  - { name: usart3, compatible: "st,stm32-usart", base: 0x40004800, size: 0x400, clock: { bus: apb1, bit: 18 },
      irqs: [ { name: global, number: 39 } ],
      dma_requests: { tx: [dma1.s3c4, dma1.s4c7], rx: dma1.s1c4 } }
  - { name: usart6, compatible: "st,stm32-usart", base: 0x40011400, size: 0x400, clock: { bus: apb2, bit: 5 },
      irqs: [ { name: global, number: 71 } ],
      dma_requests: { tx: [dma2.s6c5, dma2.s7c5], rx: [dma2.s1c5, dma2.s2c5] } }
# The serial pins' alternate functions. Ports A to C and PD2 from ST's open pin data
# (STM32F446R(C-E)Tx.xml and GPIO-STM32F446_gpio_v1_0_Modes.xml, the I2C pins' AF4 among them);
# PD5, PD6, PD8 and PD9 from DS10693 Table 11.
alternate_functions:
  PA0: { af1: tim2_ch1, af2: tim5_ch1, af8: uart4_tx, analog: adc1_in0 }
  PA1: { af1: tim2_ch2, af2: tim5_ch2, af8: uart4_rx, analog: adc1_in1 }
  PA2: { af1: tim2_ch3, af2: tim5_ch3, af7: usart2_tx, analog: adc1_in2 }
  PA3: { af1: tim2_ch4, af2: tim5_ch4, af7: usart2_rx, analog: adc1_in3 }
  PA4: { analog: adc1_in4 }
  PA5: { af1: tim2_ch1, analog: adc1_in5 }
  PA6: { af2: tim3_ch1, analog: adc1_in6 }
  PA7: { af2: tim3_ch2, analog: adc1_in7 }
  PA8: { af4: i2c3_scl }
  PA9: { af7: usart1_tx }
  PA10: { af7: usart1_rx }
  PA15: { af1: tim2_ch1 }
  PB0: { af2: tim3_ch3, analog: adc1_in8 }
  PB1: { af2: tim3_ch4, analog: adc1_in9 }
  PB2: { af1: tim2_ch4 }
  PB3: { af1: tim2_ch2, af4: i2c2_sda }
  PB4: { af2: tim3_ch1, af4: i2c3_sda }
  PB5: { af2: tim3_ch2 }
  PB6: { af2: tim4_ch1, af4: i2c1_scl, af7: usart1_tx }
  PB7: { af2: tim4_ch2, af4: i2c1_sda, af7: usart1_rx }
  PB8: { af1: tim2_ch1, af2: tim4_ch3, af4: i2c1_scl }
  PB9: { af1: tim2_ch2, af2: tim4_ch4, af4: i2c1_sda }
  PB10: { af1: tim2_ch3, af4: i2c2_scl, af7: usart3_tx }
  PB13: { af5: spi2_sck }
  PB14: { af5: spi2_miso }
  PB15: { af5: spi2_mosi }
  PC0: { analog: adc1_in10 }
  PC1: { analog: adc1_in11 }
  PC2: { analog: adc1_in12 }
  PC3: { analog: adc1_in13 }
  PC4: { analog: adc1_in14 }
  PC5: { af7: usart3_rx, analog: adc1_in15 }
  PC6: { af2: tim3_ch1, af8: usart6_tx }
  PC7: { af2: tim3_ch2, af8: usart6_rx }
  PC8: { af2: tim3_ch3 }
  PC9: { af2: tim3_ch4, af4: i2c3_sda }
  PC10: { af7: usart3_tx, af8: uart4_tx }
  PC11: { af7: usart3_rx, af8: uart4_rx }
  PC12: { af4: i2c2_sda, af8: uart5_tx }
  PD2: { af8: uart5_rx }
  PD5: { af7: usart2_tx }
  PD6: { af7: usart2_rx }
  PD8: { af7: usart3_tx }
  PD9: { af7: usart3_rx }
flash:
  region: flash
  # RM0390 Table 4: sectors 0 to 3 of 16 KiB, 4 of 64 KiB, 5 to 7 of 128 KiB
  geometry: { sectors: [16K, 16K, 16K, 16K, 64K, 128K, 128K, 128K], write_granularity: 1 }

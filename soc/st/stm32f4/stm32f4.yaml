# STM32F4 family base (SPEC-014 §3): the facts every part of the family shares. Not a part of
# its own: a part file extends a die file, which extends this one.
schema_version: 0
kind: soc
name: stm32f4
vendor: st
family: stm32f4
abstract: true
curated: true
doc: STM32F4 family facts from RM0390 Rev 6 (the F446) and PM0214; a die file narrows them.
arch: { port: cortex_m, variant: armv7em }
cpu:
  core: cortex-m4f
  fpu: fpv4-sp-d16
  mpu: { model: armv7m, regions: 8 }
  cache: none
  trustzone: false
  cycle_counter: dwt
  cflags: [-mcpu=cortex-m4, -mfpu=fpv4-sp-d16, -mfloat-abi=hard]
clocks:
  sources:
    - { name: hsi, hz: 16MHz, doc: "internal RC, the clock out of reset" }
    - { name: hse, hz: board, min_hz: 4MHz, max_hz: 26MHz, bypass_max_hz: 50MHz }
    - { name: lsi, hz: 32kHz }
    - { name: lse, hz: board }
  plls:
    # RM0390 §6.3.2: VCO input = source / M, 1 to 2 MHz (2 MHz limits jitter);
    # VCO output = input x N, 100 to 432 MHz; SYSCLK = VCO / P
    - { name: pll, inputs: [hsi, hse], m: [2, 63], n: [50, 432], p: [2, 4, 6, 8], q: [2, 15], r: [2, 7],
        vco_in_hz: [1MHz, 2MHz], vco_out_hz: [100MHz, 432MHz] }
  prescalers: { ahb: [1, 2, 4, 8, 16, 64, 128, 256, 512], apb: [1, 2, 4, 8, 16] }
  # RM0390 Table 5, 2.7 to 3.6 V: one wait state per 30 MHz of HCLK
  flash_latency: { hz_per_wait_state: 30MHz, max_wait_states: 15 }
interrupts:
  controller: nvic
  priority_bits: 4
  systick: true
debug: { swd: true, jtag: true, dwt: true, itm: true }

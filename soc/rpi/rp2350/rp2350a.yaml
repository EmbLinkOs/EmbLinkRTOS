# RP2350A: the RP2350 in the QFN-60 package, with GPIO0 to GPIO29 (RP2350 datasheet, pin
# locations; pico-sdk's PICO_RP2350A).
schema_version: 0
kind: soc
name: rp2350a
vendor: rpi
family: rp2350
extends: rp2350.yaml
part: RP2350A
package: qfn60
curated: true
gpio: { lines: 30, controller: io_bank0 }
# the ADC's inputs on this package: GPIO26 to GPIO29, then the temperature sensor (datasheet
# §12.4.1; the RP2350B's are GPIO40 to GPIO47 and 8)
peripherals:
  - { name: adc, adc: { inputs: 4, temperature: 4 } }

# The RP2350 die (SPEC-014 §3) as its Arm cores run it: two Cortex-M33 with FPU, started by the
# boot ROM in the Secure state. Drafted by hw/import/svd.py from pico-sdk 2.1.1's RP2350.svd
# (BSD-3-Clause), then curated against pico-sdk's register headers and the RP2350 datasheet:
# block sizes include each peripheral's XOR, set and clear aliases (+0x1000, +0x2000, +0x3000),
# lines 46 to 51 are the datasheet's spare interrupts for software, and the flash is the
# board's QSPI device behind the 16 MiB XIP window. A package file names the GPIO lines.
schema_version: 0
kind: soc
name: rp2350
vendor: rpi
family: rp2350
abstract: true
curated: true
imported_from: { tool: "hw/import/svd.py 0.1.0 (embsvd)", source: RP2350.svd, hash: "sha256:68140a728736378db8dd5c9bec5cd8481efed3e72cb77439a201ad48e4743609" }
arch: { port: cortex_m, variant: armv8m-main }
cpu:
  core: cortex-m33f
  fpu: fpv5-sp-d16
  mpu: { model: armv8m, regions: 8 }
  trustzone: false
  cycle_counter: dwt
  cflags: [-mcpu=cortex-m33, -mfpu=fpv5-sp-d16, -mfloat-abi=hard]
memory:
  regions:
    - { name: xip, base: 0x10000000, size: 16M, attrs: [r, x, boot], doc: "the QSPI flash, mapped by the XIP cache" }
    - { name: sram, base: 0x20000000, size: 512K, attrs: [r, w, x, dma], doc: "SRAM0 to SRAM7, striped" }
    - { name: sram_xy, base: 0x20080000, size: 8K, attrs: [r, w, x], doc: "SRAM8 and SRAM9" }
clocks:
  sources:
    - { name: xosc, hz: board, min_hz: 1MHz, max_hz: 50MHz, doc: "the crystal oscillator: clk_ref, and clk_sys without the PLL" }
  plls:
    # RP2350 datasheet §8.6: VCO input = XOSC / REFDIV (M), at least 5 MHz; VCO = input x FBDIV
    # (N, 16 to 320), 750 to 1600 MHz; clk_sys = VCO / (POSTDIV1 x POSTDIV2), each 1 to 7
    - { name: pll_sys, inputs: [xosc], m: [1, 63], n: [16, 320], postdiv: [1, 7],
        vco_in_hz: [5MHz, 800MHz], vco_out_hz: [750MHz, 1600MHz] }
    # PLL_USB, the same PLL, for clk_usb and clk_adc, which run at 48 MHz (§8.1, §12.4.2): solved
    # from the crystal like PLL_SYS, and started by the first driver that needs it (A129)
    - { name: pll_usb, inputs: [xosc], m: [1, 63], n: [16, 320], postdiv: [1, 7],
        vco_in_hz: [5MHz, 800MHz], vco_out_hz: [750MHz, 1600MHz], output_hz: 48MHz }
  buses:
    # clk_sys: the processors and the bus fabric, 150 MHz at the default core voltage (§1.2)
    - { name: sys, from: hclk, max_hz: 150MHz }
interrupts:
  controller: nvic
  count: 52
  priority_bits: 4
  systick: true
  # SPAREIRQ_IRQ_0 to 5: no peripheral raises them
  reserved: [46, 47, 48, 49, 50, 51]
peripherals:
  - { name: clocks, compatible: "rpi,rp2350-clocks", base: 0x40010000, size: 0x4000, irqs: [{ name: global, number: 30 }] }
  - { name: resets, compatible: "rpi,rp2350-resets", base: 0x40020000, size: 0x4000 }
  - { name: io_bank0, compatible: "rpi,rp2350-io-bank", base: 0x40028000, size: 0x4000, irqs: [{ name: bank0, number: 21 }] }
  - { name: pads_bank0, compatible: "rpi,rp2350-pads", base: 0x40038000, size: 0x4000 }
  - { name: xosc, compatible: "rpi,rp2350-xosc", base: 0x40048000, size: 0x4000 }
  - { name: pll_sys, compatible: "rpi,rp2350-pll", base: 0x40050000, size: 0x4000 }
  - { name: pll_usb, compatible: "rpi,rp2350-pll", base: 0x40058000, size: 0x4000 }
  - { name: uart0, compatible: "arm,pl011", base: 0x40070000, size: 0x4000, irqs: [{ name: global, number: 33 }],
      dma_requests: { tx: dma.dreq28, rx: dma.dreq29 } }
  - { name: uart1, compatible: "arm,pl011", base: 0x40078000, size: 0x4000, irqs: [{ name: global, number: 34 }],
      dma_requests: { tx: dma.dreq30, rx: dma.dreq31 } }
  # the SPI controllers are PL022s (datasheet §12.3), clocked by clk_peri
  - { name: spi0, compatible: "arm,pl022", base: 0x40080000, size: 0x4000, irqs: [{ name: global, number: 31 }],
      dma_requests: { tx: dma.dreq24, rx: dma.dreq25 } }
  - { name: spi1, compatible: "arm,pl022", base: 0x40088000, size: 0x4000, irqs: [{ name: global, number: 32 }],
      dma_requests: { tx: dma.dreq26, rx: dma.dreq27 } }
  # the I2C controllers are Synopsys DesignWare DW_apb_i2c (datasheet §12.2), clocked by clk_sys
  - { name: i2c0, compatible: "snps,designware-i2c", base: 0x40090000, size: 0x4000, irqs: [{ name: global, number: 36 }],
      dma_requests: { tx: dma.dreq44, rx: dma.dreq45 } }
  - { name: i2c1, compatible: "snps,designware-i2c", base: 0x40098000, size: 0x4000, irqs: [{ name: global, number: 37 }],
      dma_requests: { tx: dma.dreq46, rx: dma.dreq47 } }
  # the DMA controller (datasheet §12.6): 16 channels, any paced by a peripheral's DREQ (pico-sdk
  # 2.1.1, hardware/regs/dreq.h), its interrupts in four groups; it copies memory too
  - { name: dma, compatible: "rpi,rp2350-dma", base: 0x50000000, size: 0x1000,
      irqs: [ { name: irq0, number: 10 }, { name: irq1, number: 11 }, { name: irq2, number: 12 }, { name: irq3, number: 13 } ],
      dma: { kind: dreq, channels: 16, max_count: 268435455, memory: true } }
  # the watchdog (datasheet §12.9), counting the TICKS block's microsecond tick; the power-on
  # state machine (§7.4), whose WDSEL picks what a watchdog reset reaches (pico-sdk 2.1.1's
  # addressmap.h)
  - { name: watchdog, compatible: "rpi,rp2350-watchdog", base: 0x400D8000, size: 0x4000 }
  - { name: ticks, compatible: "rpi,rp2350-ticks", base: 0x40108000, size: 0x4000 }
  - { name: psm, compatible: "rpi,rp2350-psm", base: 0x40018000, size: 0x4000 }
  # the QSPI memory interface: XIP from the board's flash (window M0) and PSRAM (M1)
  - { name: qmi, compatible: "rpi,rp2350-qmi", base: 0x400D0000, size: 0x4000 }
  # the power manager (datasheet §6.4), whose always-on timer (§6.5) is the board's clock kept
  # across resets; POWMAN_IRQ_TIMER is 45
  - { name: powman, compatible: "rpi,rp2350-powman", base: 0x40100000, size: 0x4000,
      irqs: [ { name: timer, number: 45 } ] }
  # the true random number generator (datasheet §12.12), TRNG_IRQ 39
  - { name: trng, compatible: "rpi,rp2350-trng", base: 0x400F0000, size: 0x1000,
      irqs: [ { name: irq, number: 39 } ] }
  # boot RAM (datasheet §5.4.1): the boot ROM leaves its XIP setup function in the first 256 bytes
  - { name: bootram, compatible: "rpi,rp2350-bootram", base: 0x400E0000, size: 0x400 }
  - { name: sio, compatible: "rpi,rp2350-sio", base: 0xD0000000, size: 0x1000 }
  # the ADC (datasheet §12.4): 12 bits, 500 kS/s at clk_adc's 48 MHz, its result FIFO drained by
  # DREQ_ADC; the inputs and the temperature sensor's depend on the package
  - { name: adc, compatible: "rpi,rp2350-adc", base: 0x400A0000, size: 0x4000, clocked_by: pll_usb,
      adc: { bits: 12 }, irqs: [ { name: fifo, number: 35 } ], dma_requests: { rx: dma.dreq48 } }
  # the PWM block (datasheet §12.5): twelve slices of five registers each (CSR, DIV, CTR, CC, TOP,
  # 0x14 apart), each a 16-bit counter with two outputs, A and B, B also an input that gates or
  # clocks the counter; their DREQs are DREQ_PWM_WRAP0 to 11. The slices' shared registers follow
  # them: EN, INTR and the two interrupts' enables, forces and status, PWM_IRQ_WRAP_0 and _1
  - { name: pwm, compatible: "rpi,rp2350-pwm-irq", base: 0x400A80F0, size: 0x20,
      irqs: [ { name: wrap0, number: 8 }, { name: wrap1, number: 9 } ] }
  - { name: pwm0, compatible: "rpi,rp2350-pwm", base: 0x400A8000, size: 0x14, counter_bits: 16,
      dma_requests: { wrap: dma.dreq32 } }
  - { name: pwm1, compatible: "rpi,rp2350-pwm", base: 0x400A8014, size: 0x14, counter_bits: 16,
      dma_requests: { wrap: dma.dreq33 } }
  - { name: pwm2, compatible: "rpi,rp2350-pwm", base: 0x400A8028, size: 0x14, counter_bits: 16,
      dma_requests: { wrap: dma.dreq34 } }
  - { name: pwm3, compatible: "rpi,rp2350-pwm", base: 0x400A803C, size: 0x14, counter_bits: 16,
      dma_requests: { wrap: dma.dreq35 } }
  - { name: pwm4, compatible: "rpi,rp2350-pwm", base: 0x400A8050, size: 0x14, counter_bits: 16,
      dma_requests: { wrap: dma.dreq36 } }
  - { name: pwm5, compatible: "rpi,rp2350-pwm", base: 0x400A8064, size: 0x14, counter_bits: 16,
      dma_requests: { wrap: dma.dreq37 } }
  - { name: pwm6, compatible: "rpi,rp2350-pwm", base: 0x400A8078, size: 0x14, counter_bits: 16,
      dma_requests: { wrap: dma.dreq38 } }
  - { name: pwm7, compatible: "rpi,rp2350-pwm", base: 0x400A808C, size: 0x14, counter_bits: 16,
      dma_requests: { wrap: dma.dreq39 } }
  - { name: pwm8, compatible: "rpi,rp2350-pwm", base: 0x400A80A0, size: 0x14, counter_bits: 16,
      dma_requests: { wrap: dma.dreq40 } }
  - { name: pwm9, compatible: "rpi,rp2350-pwm", base: 0x400A80B4, size: 0x14, counter_bits: 16,
      dma_requests: { wrap: dma.dreq41 } }
  - { name: pwm10, compatible: "rpi,rp2350-pwm", base: 0x400A80C8, size: 0x14, counter_bits: 16,
      dma_requests: { wrap: dma.dreq42 } }
  - { name: pwm11, compatible: "rpi,rp2350-pwm", base: 0x400A80DC, size: 0x14, counter_bits: 16,
      dma_requests: { wrap: dma.dreq43 } }
  # the timers (datasheet §12.8): 64-bit counts of the TICKS block's microseconds, four alarms
  # each on the counter's low 32 bits, an interrupt per alarm
  - { name: timer0, compatible: "rpi,rp2350-timer", base: 0x400B0000, size: 0x4000, counter_bits: 64,
      irqs: [ { name: alarm0, number: 0 }, { name: alarm1, number: 1 }, { name: alarm2, number: 2 }, { name: alarm3, number: 3 } ] }
  - { name: timer1, compatible: "rpi,rp2350-timer", base: 0x400B8000, size: 0x4000, counter_bits: 64,
      irqs: [ { name: alarm0, number: 4 }, { name: alarm1, number: 5 }, { name: alarm2, number: 6 }, { name: alarm3, number: 7 } ] }
# The UARTs' function selects (pico-sdk 2.1.1, hardware/regs/io_bank0.h): f2, and f11 (UART_AUX);
# SPI1's, f1, on the lines of its first bank the Pico 2 W brings out; I2C0's and I2C1's, f3, on
# GPIO6 to GPIO9; PWM's, f4, slice (n / 2) mod 8, A on the even lines and B on the odd; the ADC's
# inputs 0 to 3 on GPIO26 to GPIO29 (datasheet §9.4, §12.4.3)
alternate_functions:
  GPIO0: { f2: uart0_tx, f4: pwm0_a }
  GPIO1: { f2: uart0_rx, f4: pwm0_b }
  GPIO2: { f4: pwm1_a, f11: uart0_tx }
  GPIO3: { f4: pwm1_b, f11: uart0_rx }
  GPIO4: { f2: uart1_tx, f4: pwm2_a }
  GPIO5: { f2: uart1_rx, f4: pwm2_b }
  GPIO6: { f3: i2c1_sda, f4: pwm3_a, f11: uart1_tx }
  GPIO7: { f3: i2c1_scl, f4: pwm3_b, f11: uart1_rx }
  GPIO8: { f2: uart1_tx, f3: i2c0_sda, f4: pwm4_a }
  GPIO9: { f2: uart1_rx, f3: i2c0_scl, f4: pwm4_b }
  GPIO10: { f1: spi1_sck, f4: pwm5_a, f11: uart1_tx }
  GPIO11: { f1: spi1_mosi, f4: pwm5_b, f11: uart1_rx }
  GPIO12: { f1: spi1_miso, f2: uart0_tx, f4: pwm6_a }
  GPIO13: { f2: uart0_rx, f4: pwm6_b }
  GPIO14: { f4: pwm7_a, f11: uart0_tx }
  GPIO15: { f4: pwm7_b, f11: uart0_rx }
  GPIO16: { f2: uart0_tx, f4: pwm0_a }
  GPIO17: { f2: uart0_rx, f4: pwm0_b }
  GPIO18: { f4: pwm1_a, f11: uart0_tx }
  GPIO19: { f4: pwm1_b, f11: uart0_rx }
  GPIO20: { f2: uart1_tx, f4: pwm2_a }
  GPIO21: { f2: uart1_rx, f4: pwm2_b }
  GPIO22: { f4: pwm3_a, f11: uart1_tx }
  GPIO23: { f4: pwm3_b, f11: uart1_rx }
  GPIO24: { f2: uart1_tx, f4: pwm4_a }
  GPIO25: { f2: uart1_rx, f4: pwm4_b }
  GPIO26: { f4: pwm5_a, f11: uart1_tx, analog: adc_in0 }
  GPIO27: { f4: pwm5_b, f11: uart1_rx, analog: adc_in1 }
  GPIO28: { f2: uart0_tx, f4: pwm6_a, analog: adc_in2 }
  GPIO29: { f2: uart0_rx, f4: pwm6_b, analog: adc_in3 }
# The boot ROM boots a flash image with a valid IMAGE_DEF block in its first 4 KiB (datasheet
# §5.9); image_type 0x1021 says EXE, SECURITY_S, CPU_ARM, CHIP_RP2350 (pico-sdk's picobin.h).
# The UF2 family ID is the ROM's for Arm Secure images.
# The QSPI flash behind the XIP window (datasheet §12.14; the boot ROM's routines, §5.5.8):
# erased by 4 KiB sectors, programmed by 256-byte pages. The board gives the chip's size.
flash:
  region: xip
  geometry: { page_size: 4K, write_granularity: 256 }
boot: { image: uf2, uf2_family: 0xE48BFF59, image_type: 0x1021 }
debug: { swd: true }

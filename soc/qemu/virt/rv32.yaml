# QEMU's RISC-V virt machine with one RV32IMAC hart in machine mode, started with -bios none:
# QEMU loads the image into RAM at 0x80000000. From QEMU's hw/riscv/virt.c. An emulation
# reference (SIM-002): the hart has no clock of its own, the timebase is the one fixed rate.
schema_version: 0
kind: soc
name: rv32
vendor: qemu
family: virt
part: qemu-virt-rv32
curated: true
arch: { port: riscv, variant: rv32imac }
cpu:
  core: rv32imac
  cflags: [-march=rv32imac_zicsr_zifencei, -mabi=ilp32]
memory:
  regions:
    - { name: ram, base: 0x80000000, size: 16M, attrs: [r, w, x, boot] }
clocks:
  sources:
    - { name: timebase, hz: 10MHz, doc: "mtime's rate (virt's RISCV_ACLINT_DEFAULT_TIMEBASE_FREQ)" }
interrupts:
  controller: clint
  # machine interrupt numbers: 0 the software interrupt (msip), 1 and up the PLIC sources
  count: 8
  reserved: [0]
peripherals:
  - { name: test, compatible: "sifive,test0", base: 0x00100000, size: 0x1000, doc: "exit (0x5555, 0x3333) and reset (0x7777)" }
  - { name: clint, compatible: "riscv,clint0", base: 0x02000000, size: 0x10000 }
  - { name: uart0, compatible: "national,ns16550a", base: 0x10000000, size: 0x100 }

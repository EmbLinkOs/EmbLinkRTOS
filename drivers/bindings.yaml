# Driver bindings (SPEC-016 §8, DRV-009): for each compatible, its class, the sources the image
# needs for it, the header declaring its configuration and operations, and where each
# configuration field comes from in the description. emb-hwgen binds every board device
# through this table and refuses a compatible it does not name.
#
# A field reads peripheral.<key> (the SoC node: base, irqs.<name>, clock.bus, clock.bit,
# clock.enable_offset, and clock_hz, the frequency it is clocked at), device.<key> (the board
# device's own properties; device.bus is a reference to the bus device), board.<path> or
# soc.<path> (the SoC description's own facts: soc.gpio.lines), or pins.<signal> (the GPIO line
# carrying the device's pin: an I2C bus's SCL and SDA, which its recovery drives by hand).
schema_version: 0
kind: bindings
bindings:
  arm,cmsdk-uart:
    class: uart
    level: early
    sources: [drivers/arm/cmsdk_uart.c]
    include: drivers/arm/include
    header: emb_cmsdk_uart.h
    api: emb_cmsdk_uart_api.dev
    config: emb_cmsdk_uart_config_t
    data: emb_cmsdk_uart_data_t
    fields:
      base: peripheral.base
      clock_hz: peripheral.clock_hz
      baud: device.baud
      irq_rx: peripheral.irqs.rx
      irq_tx: peripheral.irqs.tx
    buffers: { rx: { size: device.rx_buffer, default: 64 } }
    doc: the MPS2 boards' UARTs (SPEC-017 §4), the console among them
  st,stm32f4-rcc:
    class: clock
    level: early
    sources: [drivers/st/stm32_devices.c]
    include: drivers/st/include
    header: emb_stm32_devices.h
    api: emb_stm32_rcc_api
    config: emb_stm32_rcc_config_t
    fields: { base: peripheral.base }
    doc: the clock tree the board support brings up before the kernel; READY once its switch is done
  st,stm32-gpio:
    class: gpio
    level: early
    sources: [drivers/st/stm32_devices.c]
    include: drivers/st/include
    header: emb_stm32_devices.h
    api: emb_stm32_gpio_api.dev
    config: emb_stm32_gpio_config_t
    fields: { base: peripheral.base, clken_offset: peripheral.clock.enable_offset, clken_bit: peripheral.clock.bit }
  st,stm32-usart:
    class: uart
    level: early
    sources: [drivers/st/stm32_uart.c]
    include: drivers/st/include
    header: emb_stm32_devices.h
    api: emb_stm32_usart_api.dev
    config: emb_stm32_usart_config_t
    data: emb_stm32_usart_data_t
    fields:
      base: peripheral.base
      clock_hz: peripheral.clock_hz
      baud: device.baud
      clken_offset: peripheral.clock.enable_offset
      clken_bit: peripheral.clock.bit
      irq: peripheral.irqs.global
    buffers: { rx: { size: device.rx_buffer, default: 64 } }
    doc: the console, polled, with the UART class's requests to come (SPEC-017 §4)
  arm,pl011:
    class: uart
    level: early
    sources: [drivers/arm/pl011.c]
    include: drivers/arm/include
    header: emb_pl011.h
    api: emb_pl011_api.dev
    config: emb_pl011_config_t
    data: emb_pl011_data_t
    fields: { base: peripheral.base, clock_hz: peripheral.clock_hz, baud: device.baud, irq: peripheral.irqs.global }
    buffers: { rx: { size: device.rx_buffer, default: 64 } }
    doc: the RP2350's UARTs; the console, polled, with the UART class's requests to come (SPEC-017 §4)
  rpi,rp2350-clocks:
    class: clock
    level: early
    sources: [drivers/rpi/rp2350_devices.c, drivers/rpi/rp2350_gpio.c]
    include: drivers/rpi/include
    header: emb_rp2350_devices.h
    api: emb_rp2350_clocks_api
    config: emb_rp2350_clocks_config_t
    fields: { base: peripheral.base }
    doc: the clock tree the board support brings up from the crystal before the kernel
  rpi,rp2350-io-bank:
    class: gpio
    level: early
    sources: [drivers/rpi/rp2350_devices.c, drivers/rpi/rp2350_gpio.c]
    include: drivers/rpi/include
    header: emb_rp2350_devices.h
    api: emb_rp2350_io_bank_api.dev
    config: emb_rp2350_io_bank_config_t
    fields: { base: peripheral.base, lines: soc.gpio.lines }
  arm,pl022:
    class: spi
    level: kernel
    sources: [drivers/arm/pl022.c]
    include: drivers/arm/include
    header: emb_pl022.h
    api: emb_pl022_api
    config: emb_pl022_config_t
    data: emb_pl022_data_t
    fields: { base: peripheral.base, clock_hz: peripheral.clock_hz, irq: peripheral.irqs.global }
    doc: the RP2350's SPI controllers, and QEMU's MPS2 models (SPEC-017 §5)
  st,stm32-spi:
    class: spi
    level: kernel
    sources: [drivers/st/stm32_spi.c]
    include: drivers/st/include
    header: emb_stm32_devices.h
    api: emb_stm32_spi_api
    config: emb_stm32_spi_config_t
    data: emb_stm32_spi_data_t
    fields:
      base: peripheral.base
      clock_hz: peripheral.clock_hz
      clken_offset: peripheral.clock.enable_offset
      clken_bit: peripheral.clock.bit
      irq: peripheral.irqs.global
  st,stm32-i2c:
    class: i2c
    level: kernel
    sources: [drivers/st/stm32_i2c.c]
    include: drivers/st/include
    header: emb_stm32_devices.h
    api: emb_stm32_i2c_api.dev
    config: emb_stm32_i2c_config_t
    data: emb_stm32_i2c_data_t
    fields:
      base: peripheral.base
      clock_hz: peripheral.clock_hz
      clken_offset: peripheral.clock.enable_offset
      clken_bit: peripheral.clock.bit
      irq_ev: peripheral.irqs.ev
      irq_er: peripheral.irqs.er
      scl: pins.scl
      sda: pins.sda
    doc: the STM32F4's I2C, controller and target, standard and fast mode (SPEC-017 §6)
  snps,designware-i2c:
    class: i2c
    level: kernel
    sources: [drivers/snps/dw_i2c.c]
    include: drivers/snps/include
    header: emb_dw_i2c.h
    api: emb_dw_i2c_api.dev
    config: emb_dw_i2c_config_t
    data: emb_dw_i2c_data_t
    fields: { base: peripheral.base, clock_hz: peripheral.clock_hz, irq: peripheral.irqs.global, scl: pins.scl, sda: pins.sda }
    doc: Synopsys DW_apb_i2c, the RP2350's I2C0 and I2C1, controller or target (SPEC-017 §6)

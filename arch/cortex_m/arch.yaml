# Port manifest for Cortex-M (format: SPEC-011 §2). Variants: Armv6-M (Cortex-M0/M0+: PRIMASK
# critical sections, no CAS, A86), Armv7-M (Cortex-M3),
# Armv7E-M (Cortex-M4/M7, with or without FPU), Armv8-M Mainline (Cortex-M33, in the Secure
# state, TrustZone unused; A78). Armv8-M Baseline follows (07 §2, M3).
arch: cortex_m
variants: [armv6m, armv7m, armv7em, armv8m-main]
word_bits: 32
endian: little
# context frame: 8 hardware words, 8 callee-saved words, EXC_RETURN, and on Armv8-M Mainline
# the thread's PSPLIM (A80); plus 16 + 18 floating-point words when the thread has used the
# FPU (lazy stacking).
stack: { align: 8, growth: down, min_thread: 256, context_frame: 208 }
features:
  irq_nesting: true
  zero_latency_irqs: [armv7m, armv7em, armv8m-main]
  cas: [armv7m, armv7em, armv8m-main]
  interrupt_stack: true
  hw_stack_limit: [armv8m-main]
  mpu: none
  fpu_lazy: [armv7em, armv8m-main]
  cycle_counter: [armv6m, armv7m, armv7em, armv8m-main]
  tickless: false # periodic tick only: the port refuses EMB_TICKLESS (Kconfig)
  smp: false
  syscall_trap: none
  fault_entry: true
  priority_bits: board
tcb_extension_bytes: 0

# Time slicing with the tickless clock: the quantum is one more programmed deadline
# (SPEC-003 §8). Conformance only; the differential bridge needs the periodic clock
# (configs/native-timeslice.conf).
CONFIG_EMB_TIME_SLICING=y
CONFIG_EMB_TIMESLICE_TICKS=2
CONFIG_EMB_TIMESLICE_PRIORITY=20

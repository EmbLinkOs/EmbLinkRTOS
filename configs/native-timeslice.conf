# Round-robin time slicing on the deterministic native test port (KRN-SCH-007, 026, 037):
# a short quantum so a few ticks rotate, and a threshold so levels above 20 are not sliced.
CONFIG_EMB_TIME_SLICING=y
CONFIG_EMB_TIMESLICE_TICKS=2
CONFIG_EMB_TIMESLICE_PRIORITY=20
# Work-queue statistics (KRN-WQ-011), also off by default, are built and tested here too.
CONFIG_EMB_WORKQ_STATS=y
# Periodic clock: the quantum then counts delivered ticks exactly, as the model does. In
# tickless builds it starts from the free-running counter, which the model cannot see.
# CONFIG_EMB_TICKLESS is not set
